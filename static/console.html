<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<title>KODA Console</title>
<link rel="stylesheet" href="/static/fonts.css">
<link rel="stylesheet" href="/static/ui.css">
<style>
  .app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
  .rail{background:var(--navy);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .rail .brand{display:flex;align-items:center;gap:10px;padding:2px 8px}
  .rail .brand small{display:block;font-size:11px;color:var(--navy-mute);margin-top:1px}
  .grp{display:grid;gap:2px;margin-bottom:18px}.grp h4{margin:0 0 4px;padding:0 10px;font-size:12px;font-weight:500;color:var(--navy-mute)}
  .nav a{display:flex;align-items:center;gap:11px;height:36px;padding:0 10px;border-radius:6px;color:#C9D4E3;font-size:14px;font-weight:500;position:relative}
  .nav a:hover{background:var(--navy2);text-decoration:none;color:#fff}
  .nav a.on{background:var(--navy2);color:#fff}.nav a.on::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--amber)}
  .nav a .n{margin-left:auto;background:var(--amber);color:var(--navy);font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px}
  .rail .foot{margin-top:auto;padding:0 8px;font-size:12px;color:var(--navy-mute);display:grid;gap:8px}
  .rail .foot button{color:#C9D4E3;text-align:left;font-size:13px;font-weight:500;display:flex;gap:8px;align-items:center}.rail .foot button:hover{color:#fff}
  .main{display:flex;flex-direction:column;min-width:0}
  .top{height:56px;background:var(--panel);border-bottom:1px solid var(--line);padding:0 28px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
  .top .crumb{font-size:13px;color:var(--mute)}.top .env{margin-left:auto;display:flex;align-items:center;gap:14px}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center}
  .page{padding:28px;max-width:1360px;width:100%;margin:0 auto;flex:1}
  .pagehead{margin-bottom:22px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .pagehead h1{font-size:30px}.pagehead p{color:var(--mute);margin-top:6px;max-width:70ch}.pagehead .push{margin-left:auto}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr)}
  .kpis>div{padding:18px 20px;border-left:1px solid var(--line)}.kpis>div:first-child{border-left:0}
  .kpis .k{font-size:13px;color:var(--mute);display:flex;justify-content:space-between;align-items:center}
  .kpis .v{font-family:'Figtree',sans-serif;font-weight:700;font-size:36px;letter-spacing:-.03em;margin-top:8px;line-height:1}
  .kpis .s{font-size:12px;color:var(--mute);margin-top:8px}
  .cols{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
  .stack{display:grid;gap:20px}
  /* departure board */
  .board{background:var(--navy);color:#fff;border-radius:var(--r);overflow:hidden}
  .board .bh{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--navy-line)}
  .board .bh h2{font-size:16px}.board .bh span{color:var(--navy-mute);font-size:13px;margin-left:auto}
  @media(max-width:1000px){#aiDesk{grid-template-columns:1fr!important}}
  .brow{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:6px 16px;padding:14px 18px;border-bottom:1px solid var(--navy-line)}
  .brow:last-of-type{border-bottom:0}
  .brow .code{font-family:'Geist Mono',monospace;font-weight:600;color:var(--amber);font-size:18px;letter-spacing:.02em}
  .brow .route{font-family:'Geist Mono',monospace;font-size:15px;letter-spacing:.04em;display:flex;align-items:center;gap:10px}
  .brow .route em{font-style:normal;color:var(--navy-mute);font-family:Geist,sans-serif;font-size:12px;letter-spacing:0}
  .brow .st{justify-self:end;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
  .brow .st i{width:8px;height:8px;border-radius:50%;display:block}
  .brow .meta{grid-column:2/4;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--navy-mute)}
  .brow .meta a,.brow .meta button{color:var(--amber);font-weight:600}
  .brow .trk{grid-column:1/4}
  .boardempty{padding:34px 18px;color:var(--navy-mute);text-align:center}
  .tool{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 18px;border-top:1px solid var(--navy-line);background:var(--navy2);font-size:13px;color:#C9D4E3}
  .tool .field{background:var(--navy);border-color:var(--navy-line);color:#fff;width:auto;height:34px}
  .tool .field.min{width:84px;text-align:right}
  .tool .btn{height:34px;background:var(--amber);border-color:var(--amber);color:var(--navy)}
  .tool .btn:hover{background:#FFC24D}
  /* lists */
  .qlist{display:grid;gap:0}.qitem{display:block;padding:12px 14px;border-bottom:1px solid var(--line2);color:inherit}.qitem:hover{background:#F8FAFD;text-decoration:none}
  .qitem.on{background:var(--cobalt-t);box-shadow:inset 3px 0 0 var(--cobalt)}
  .split{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
  .tl{display:grid}.tl>div{display:grid;grid-template-columns:22px 1fr auto;gap:12px;padding-bottom:18px;position:relative}
  .tl>div:not(:last-child)::before{content:'';position:absolute;left:10px;top:22px;bottom:2px;width:2px;background:var(--line)}
  .tl .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--green);color:var(--green);display:grid;place-items:center;background:#fff}
  .tl .dot.wait{border-color:var(--amber);color:var(--amber-d);background:var(--amber-t)}
  .tl .dot .ms{font-size:14px}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:8px 14px;font-size:13px}.kv dt{color:var(--mute)}.kv dd{margin:0}
  .search{position:relative;max-width:300px}.search .ms{position:absolute;left:10px;top:10px;color:var(--faint);font-size:18px}.search input{padding-left:34px}
  details.mk summary{cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:16px 18px;list-style:none}
  details.mk summary::-webkit-details-marker{display:none}
  details.mk summary::after{content:'expand_more';font-family:'Material Symbols Outlined';margin-left:auto;font-size:20px;color:var(--mute)}
  details.mk[open] summary::after{content:'expand_less'}
  details.mk .body{padding:0 18px 18px;display:grid;gap:14px;font-size:13px}
  .empty{text-align:center;padding:56px 20px;color:var(--mute)}.empty .ms{font-size:36px;color:var(--faint)}.empty h2{font-size:18px;color:var(--ink);margin:8px 0 4px}
  .menu{display:none}
  @media(max-width:1100px){.cols,.split{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.kpis>div:nth-child(3){border-left:0}.kpis>div:nth-child(n+3){border-top:1px solid var(--line)}}
  @media(max-width:860px){.app{grid-template-columns:1fr}.rail{position:static;height:auto;flex-direction:row;align-items:center;gap:8px;padding:10px 12px;overflow-x:auto}
    .rail .grp h4,.rail .foot{display:none}.rail nav{display:flex;gap:2px}.rail .grp{display:flex}.nav a{white-space:nowrap;padding:0 12px}.nav a .ms{display:none}.nav a.on::before{display:none}
    .top{padding:0 16px}.page{padding:16px}.brow{grid-template-columns:1fr}.brow .meta,.brow .trk{grid-column:1}.brow .st{justify-self:start}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><div><span class="wordmark" role="img" aria-label="KODA"><i>K</i><i>O</i><i>D</i><i>A</i></span><small>Orchid Insure</small></div></div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="foot"><span id="srcNote">Demo data. Payouts are simulated.</span><button id="reset"><span class="ms">refresh</span>Reset demo data</button></div>
  </aside>
  <div class="main">
    <header class="top"><span class="crumb" id="crumb"></span>
      <div class="env"><span id="aiOn"></span><span class="chip blue">Demo</span><div style="text-align:right;line-height:1.2"><div style="font-weight:600;font-size:13px">Nok P.</div><div class="mute" style="font-size:12px">Claims reviewer</div></div><span class="avatar">NP</span></div></header>
    <main id="view" class="page"></main>
  </div>
</div>
<script src="/static/ui.js"></script>
<script>
let route = location.hash.slice(1) || 'overview', last = '', ov = null, RM = 'TH', FQ = '';
let SIMSEL = '', LIVE = {};
const GROUPS = [
  ['Operations', [['overview', 'dashboard', 'Overview'], ['review', 'rule', 'Review queue'], ['decisions', 'gavel', 'Decisions'], ['baggage', 'luggage', 'Baggage claims']]],
  ['Book of business', [['policies', 'verified_user', 'Policies']]],
  ['Governance', [['rules', 'tune', 'Rules'], ['compliance', 'balance', 'Markets and law'], ['audit', 'history', 'Audit log']]],
  ['Evidence', [['performance', 'monitoring', 'Performance']]],
];
const TITLES = {overview: 'Overview', policies: 'Policies', decisions: 'Decisions', review: 'Review queue', baggage: 'Baggage claims', rules: 'Rules', compliance: 'Markets and law', audit: 'Audit log', performance: 'Performance'};
window.onhashchange = () => { route = location.hash.slice(1) || 'overview'; last = ''; FQ = ''; refresh(); };
const flightOf = f => `${esc(f.origin)} to ${esc(f.dest)}`;
const mk = code => (ov.markets.find(m => m.code === code) || {name: code, currency: ''});

function head(title, sub = '', right = '') { return `<div class="pagehead"><div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div>${right ? `<div class="push">${right}</div>` : ''}</div>`; }
function empty(icon, t, s) { return `<div class="panel empty"><span class="ms">${icon}</span><h2>${t}</h2><p>${s}</p></div>`; }
const searchBox = ph => `<label class="search"><span class="ms">search</span><input id="fq" class="field" placeholder="${ph}" value="${esc(FQ)}" aria-label="${ph}"></label>`;
const matchQ = (...v) => !FQ || v.join(' ').toLowerCase().includes(FQ.toLowerCase());

async function refresh() {
  ov = await api('/api/console/overview?market=' + RM);
  const held = ov.stats.held, bags = ov.stats.bag_waiting, base = route.split('/')[0];
  try { LIVE = await api('/api/live/status'); } catch (e) { LIVE = {}; }
  $('#srcNote').innerHTML = LIVE.enabled ? (LIVE.last_error ? `<b>Live flights:</b> ${esc(LIVE.last_error)}` : `<span class="radar" style="width:8px;height:8px;margin-right:6px"></span>Live flight data on, ${LIVE.used} of ${LIVE.budget} lookups used.`) : 'Live flight data is off here. Set AVIATIONSTACK_KEY on Cloud Run to switch it on.';
  $('#nav').innerHTML = GROUPS.map(([g, items]) => `<div class="grp"><h4>${g}</h4>${items.map(([k, ic, t]) => { const n = k === 'review' ? held : k === 'baggage' ? bags : 0; return `<a href="#${k}" class="${base === k ? 'on' : ''}" ${base === k ? 'aria-current="page"' : ''}>${ico(ic)}<span>${t}</span>${n ? `<span class="n">${n}</span>` : ''}</a>`; }).join('')}</div>`).join('');
  const [page, arg] = route.split('/');
  $('#crumb').textContent = 'Orchid Insure  /  ' + (TITLES[page] || 'Overview');
  let html;
  try { html = await ({overview: vOverview, policies: vPolicies, decisions: vDecisions, review: vReview, baggage: vBaggage, rules: vRules, compliance: vCompliance, audit: vAudit, performance: vPerformance}[page] || vOverview)(arg); }
  catch (e) { html = empty('error', 'Could not load this page', esc(e)); }
  if (html !== last) { $('#view').innerHTML = `<div class="rise">${html}</div>`; last = html; bindAll(); typeAll($('#view')); }
}

/* ---------- Overview ---------- */
function vOverview() {
  const s = ov.stats, o = ov.outcomes;
  const share = s.paid_count ? Math.round(100 * s.auto_paid / s.paid_count) + '%' : 'n/a';
  const tracked = [...ov.flights].sort((a, b) => (b.travelers > 0) - (a.travelers > 0));
  const covered = tracked.filter(f => f.travelers > 0).length;
  const kpi = (k, ic, v, sub) => `<div><div class="k">${k}${ico(ic, 'mute')}</div><div class="v">${v}</div><div class="s">${sub}</div></div>`;
  const recent = ov.decisions.filter(d => d.kind === 'delay').slice(0, 6);
  return head('Overview', 'Cover sold, flights being watched and every payout decision, across all markets. Totals are in US dollars at indicative demo rates.') + `
  <div class="panel kpis">${kpi('Active policies', 'verified_user', num(s.active), s.premium_usd ? 'Premium written ' + usd(s.premium_usd) : 'No cover sold yet')}
    ${kpi('Paid out', 'payments', usd(s.paid_amount_usd), s.paid_count + (s.paid_count === 1 ? ' payout' : ' payouts') + ', simulated')}
    ${kpi('Held for review', 'schedule', s.held, s.held ? '<a href="#review">Open the review queue</a>' : 'Nothing is waiting for a person')}
    ${kpi('Paid automatically', 'bolt', share, 'Payouts with no human step')}</div>
  ${aiDesk()}
  <div class="cols"><div class="stack">
    <section class="board" aria-label="Flight watch"><div class="bh"><h2>Flight watch</h2><span>${covered} of ${tracked.length} flights have cover</span></div>
      ${tracked.length ? tracked.slice(0, 5).map(f => {
        const m = mk(f.market), late = f.delay_minutes > 0, r = ov.rules_all[f.market] || ov.rules;
        return `<div class="brow"><div class="code">${esc(f.code)}</div>
          <div class="route">${esc(f.origin)} <span class="ms" style="color:var(--amber);font-size:16px">flight_takeoff</span> ${esc(f.dest)} <em>${esc(f.origin_city)} to ${esc(f.dest_city)}</em></div>
          <div class="st"><i style="background:${late ? 'var(--amber)' : '#34D399'}"></i>${late ? 'Delayed ' + hm(f.delay_minutes) : 'On time'}</div>
          <div class="meta"><span>${esc(f.depart_label)}</span><span>${esc(m.name)}, ${esc(m.currency)}</span><span>${f.travelers} covered ${f.travelers === 1 ? 'traveler' : 'travelers'}</span><span>${f.source === 'live' ? 'Real flight, checked ' + ago(f.fetched_at) + ' <button class="chk" data-f="' + esc(f.code) + '">Check now</button>' : 'Sample flight'}</span></div>
          <div class="trk">${delayTrack(f.delay_minutes, r, m.currency, true).replace('class="dtrack tall', 'class="dtrack mini')}</div></div>`;
      }).join('') + (tracked.length > 5 ? `<div class="boardempty" style="padding:10px">${tracked.length - 5} more sample flights are available in the test box below.</div>` : '') : '<div class="boardempty">No flights loaded.</div>'}
      <div class="tool"><span>Test an event on</span><select id="simFlight" class="field" aria-label="Flight">${tracked.map(f => `<option value="${esc(f.code)}" ${f.code === SIMSEL ? 'selected' : ''}>${esc(f.code)} ${flightOf(f)}${f.travelers ? '' : ' (no cover yet)'}</option>`).join('')}</select>
        <input id="simMin" class="field min" type="number" min="0" max="2880" value="200" aria-label="Delay in minutes"><span>minutes</span><button id="simGo" class="btn" ${tracked.length ? '' : 'disabled'}>Run delay</button><button id="simCancel" class="btn" ${tracked.length ? '' : 'disabled'}>Cancel flight</button><button id="simOk" class="btn" ${tracked.length ? '' : 'disabled'}>Lands on time</button></div></section>
    <section class="panel"><div class="ph"><h2>Recent decisions</h2><a class="push" href="#decisions">All decisions</a></div>
      ${recent.length ? `<div class="tbl"><table><thead><tr><th>Decision</th><th>Policy</th><th>Outcome</th><th class="r">Amount</th></tr></thead><tbody>${recent.map(d => `<tr class="click" onclick="location.hash='${d.status === 'held' ? 'review/' + esc(d.id) : 'decisions/' + esc(d.policy_id)}'"><td class="mono">${esc(d.id)}</td><td class="mono">${esc(d.policy_id)}</td><td>${outcomeChip(d)}</td><td class="r mono">${money(d.amount, d.currency)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="pb mute">No decisions yet. A delay that reaches a payout rule creates one.</div>'}</section>
  </div><div class="stack">
    <section class="panel"><div class="ph"><h2>Claim outcomes</h2></div><div class="pb">${outcomeBar(o)}</div></section>
    <section class="panel"><div class="ph"><h2>Paid out by market</h2></div><div class="pb">${ov.by_market.length ? barList(ov.by_market.map(m => ({label: mk(m.market).name, value: m.usd, text: usd(m.usd)}))) : '<p class="mute">No payouts yet.</p>'}</div></section>
  </div></div>`;
}
function aiDesk() {
  const done = ov.decisions.filter(d => d.kind === 'delay' && d.status !== 'pending');
  const secs = done.map(d => d.seconds).filter(x => x != null), avg = secs.length ? Math.round(secs.reduce((a, b) => a + b, 0) / secs.length) : 8;
  const auto = ov.decisions.filter(d => d.decided_by === 'system' && d.status === 'paid').length;
  const feed = ov.decisions.slice(0, 5).map(d => {
    const m = d.status === 'held' ? 'sent to a person' : d.status === 'declined' ? 'declined by a person' : d.decided_by === 'system' ? 'paid with no human step' : 'approved by a person';
    const href = d.status === 'held' ? '#review/' + esc(d.id) : d.kind === 'baggage' ? '#baggage/' + esc(d.id.replace('-D', '')) : '#decisions/' + esc(d.policy_id);
    return `<a href="${href}"><span class="ic">${STAR}</span><span><b>${esc(d.flight)}${d.kind === 'delay' ? ', ' + hm(d.delay_minutes || 0) + ' late' : ', lost bag'}</b><small>Risk ${d.risk_score ?? '-'}, ${m}</small></span><span class="mono">${d.status === 'held' ? 'review' : money(d.amount, d.currency)}</span></a>`;
  }).join('');
  return `<section class="panel" style="margin-bottom:20px"><div class="ph"><h2>KODA AI at work</h2>${aiChip('Gemini on Vertex AI')}<span class="push mute">${auto} ${auto === 1 ? 'claim' : 'claims'} paid with no human step</span></div>
    <div class="pb" style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:32px" id="aiDesk">
      <div><div class="mute" style="font-size:13px;margin-bottom:12px">Time from delay to decision</div>${speedCompare(avg)}
        <div class="aistrip" style="margin-top:18px"><div>${ico('flight')}Delay or cancel found</div><div>${ico('shield')}AI checks the policy</div><div>${ico('paid')}Money is sent</div><div>${ico('info')}Traveler is told</div></div></div>
      <div><div class="mute" style="font-size:13px;margin-bottom:4px">Latest decisions</div>${feed ? `<div class="feed">${feed}</div>` : '<p class="mute" style="padding:12px 0">Run a delay test below and watch the AI decide.</p>'}</div></div></section>`;
}
function outcomeChip(d) {
  return d.status === 'held' ? '<span class="chip held"><i></i>Held for review</span>' : d.status === 'declined' ? '<span class="chip red"><i></i>Declined</span>'
    : d.status === 'pending' ? '<span class="chip held"><i></i>Waiting</span>' : d.decided_by === 'system' ? '<span class="chip paid"><i></i>Paid automatically</span>' : '<span class="chip blue"><i></i>Approved by a person</span>';
}

/* ---------- Policies ---------- */
async function vPolicies() {
  const rows = (await api('/api/console/policies')).filter(p => matchQ(p.id, p.pnr, p.traveler, p.flight, p.market));
  return head('Policies', 'Every policy with active cover. Amounts are in each policy\'s own currency.', searchBox('Search policies')) +
    (rows.length ? `<div class="panel tbl"><table><thead><tr><th>Policy</th><th>PNR</th><th>Traveler</th><th>Flight</th><th>Market</th><th>Cover</th><th>Delay claim</th><th>Bag claim</th></tr></thead><tbody>
    ${rows.map(p => { const d = p.decision, b = p.bag, c = p.currency;
      return `<tr class="${d ? 'click' : ''}" ${d ? `onclick="location.hash='decisions/${esc(p.id)}'"` : ''}><td class="mono">${esc(p.id)}${p.status === 'archived' ? ' <span class="chip">Archived</span>' : ''}</td><td class="mono">${esc(p.pnr || '')}</td><td>${esc(p.traveler)}</td><td class="mono">${esc(p.flight)}</td><td>${esc(p.market)}, ${esc(c)}</td><td>${[p.delay_cover && 'Delay', p.baggage_cover && 'Baggage'].filter(Boolean).join(' and ') || 'None'}</td>
        <td>${d ? outcomeChip({status: d.status, decided_by: d.status === 'paid' ? 'x' : null}).replace('Approved by a person', 'Paid') + ' <span class="mono">' + money(d.amount, c) + '</span>' : '<span class="faint">None</span>'}</td><td>${b ? esc(b.status) + ' <span class="mono">' + money(b.amount, c) + '</span>' : '<span class="faint">None</span>'}</td></tr>`; }).join('')}</tbody></table></div>`
      : empty('inbox', FQ ? 'No policies match' : 'No policies yet', FQ ? 'Try a different search.' : 'Open the traveler app, pick a flight and add cover.'));
}

/* ---------- Decisions ---------- */
async function vDecisions(pid) {
  if (!pid) {
    const list = ov.decisions.filter(d => d.kind === 'delay' && d.status !== 'held' && matchQ(d.id, d.policy_id, d.status));
    return head('Decisions', 'Every delay decision, with the reason behind it.', searchBox('Search decisions')) + (list.length ?
      `<div class="panel tbl"><table><thead><tr><th>Decision</th><th>Policy</th><th>Outcome</th><th class="r">Amount</th></tr></thead><tbody>${list.map(d => `<tr class="click" onclick="location.hash='decisions/${esc(d.policy_id)}'"><td class="mono">${esc(d.id)}</td><td class="mono">${esc(d.policy_id)}</td><td>${outcomeChip(d)}</td><td class="r mono">${money(d.amount, d.currency)}</td></tr>`).join('')}</tbody></table></div>` :
      empty('gavel', 'No decisions yet', 'Run a delay test on the Overview page, or wait for a real delay.'));
  }
  const {policy: p, flight: f, decision: d, rules, market: mkt} = await api('/api/console/decision/' + pid);
  const cur = p.currency;
  if (!d) return head('Decisions') + empty('gavel', 'No decision for this policy yet', 'No delay has reached the payout rule.');
  if (d.status === 'held') return head('Decisions') + empty('schedule', 'This claim is waiting for a person', `Open it in the <a href="#review/${esc(d.id)}">review queue</a>.`);
  const auto = d.decided_by === 'system', declined = d.status === 'declined', th = rules.risk_threshold;
  const chip = declined ? '<span class="chip red"><i></i>Declined by a person</span>' : auto ? '<span class="chip paid"><i></i>Paid automatically</span>' : '<span class="chip blue"><i></i>Approved by a person</span>';
  const cx = d.trigger === 'cancel';
  const sub = {'Event detected': cx ? `Flight ${esc(f.code)} cancelled` : `Scheduled ${esc(f.scheduled)}, ${hm(d.delay_minutes)} late`, 'Traveler notified': 'Caring message sent', 'Traveler told a person will look': 'Holding message sent', 'Delay detected': `Scheduled ${esc(f.scheduled)}, ${hm(d.delay_minutes)} late`, 'Policy matched': 'Cover is active for this flight', 'Risk checked': d.risk_score >= th ? 'Flagged, sent to a person' : 'Fraud checks passed', 'Paid': declined ? 'Not paid' : `${money(d.amount, cur)} sent to ${esc(p.payout_account)}`, 'Held for review': 'Waiting for a person'};
  const parts = d.breakdown && d.breakdown.length ? d.breakdown : [['Base score for any traveler', d.risk_score]];
  return `<p class="mute" style="margin-bottom:8px"><a href="#decisions">Decisions</a> / <span class="mono">${esc(p.id)}</span></p>` +
    head(declined ? `Declined ${money(d.amount, cur)}` : `Paid ${money(d.amount, cur)}`, `${esc(p.traveler)} on ${esc(f.airline)} <span class="mono">${esc(f.code)}</span>, ${flightOf(f)}`, chip) + `
  <div class="panel" style="margin-bottom:20px"><div class="ph"><h2>${cx ? 'Cancellation event' : 'Delay against the payout rules'}</h2><span class="push mute">${esc(mkt.name)}, ${esc(cur)}</span></div><div class="pb">${cx ? `<div class="note info"><b>${esc(f.code)} was cancelled.</b> Rule: cancelled flights pay ${money(rules.cancel_payout, cur)} at once, with no waiting tier.</div>` : delayTrack(d.delay_minutes, rules, cur)}</div></div>
  <div class="cols" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)"><section class="panel"><div class="ph"><h2>Decision timeline</h2>${auto ? `<span class="chip push mono">${d.elapsed_ms ? d.elapsed_ms + ' ms to decide' : '8s'}</span>` : ''}</div><div class="pb tl">
      ${d.timeline.map(s => `<div><span class="dot ${s.pending ? 'wait' : ''}">${ico(s.pending ? 'hourglass_top' : 'check')}</span><div><b>${esc(s.label)}</b><div class="mute" style="font-size:13px">${sub[s.label] || ''}</div></div><span class="mono mute" style="font-size:12px">${s.sec}s</span></div>`).join('')}</div></section>
    <div class="stack"><section class="panel"><div class="ph"><h2>Risk score</h2><span class="push">${aiChip('AI scored')}</span></div><div class="pb">${gauge(d.risk_score, th)}<div style="height:12px"></div>${scoreBreakdown(parts, th)}</div></section>
      <section class="panel"><div class="ph"><h2>${declined ? 'Why it was declined' : 'Why it was paid'}</h2><span class="push">${aiChip('AI explained')}</span></div><div class="pb" style="display:grid;gap:12px">
        <div class="note info"><b>${esc(d.clause)}</b></div><div class="aicard">${aiChip('KODA AI')}${aiText(d.explanation)}</div>
        ${mkt.statutory ? `<div class="note"><b>Airline obligations in ${esc(mkt.name)}.</b> ${esc(mkt.statutory)} KODA pays on top of this.</div>` : ''}
        ${d.context ? `<div class="note"><b>Ground conditions at ${esc(d.context.airport)}.</b> ${esc(d.context.text || d.context.weather)}. ${esc(d.context.operations)}. ${d.context.fits ? 'Conditions are consistent with the event.' : 'Conditions look normal, so the cause is not weather.'} <span class="mute">${esc(d.context.source)}${d.context.ops_source ? '; ' + esc(d.context.ops_source).toLowerCase() : ''}. Context for the reviewer only, it never changes the payout.</span></div>` : ''}
        ${d.message ? `<div class="note info"><b>Message sent to the traveler.</b> ${esc(d.message)}</div>` : ''}
        <div class="note good">${auto ? 'Paid with no human review and no forms.' : `Decided by ${esc(d.decided_by)}.${d.note ? ' Note: ' + esc(d.note) : ''}`}</div></div></section></div></div>`;
}

/* ---------- Review queue ---------- */
async function vReview(id) {
  const q = await api('/api/console/review');
  if (!q.length) return head('Review queue', 'Claims that need a person.') + empty('task_alt', 'Nothing is waiting', 'Held claims appear here. Run a delay test on the Overview page to create one.');
  const d = q.find(x => x.id === id) || q[0];
  const info = await api('/api/console/decision/' + d.policy_id);
  const p = info.policy, f = info.flight, th = info.rules.risk_threshold, cur = p.currency, parts = d.breakdown && d.breakdown.length ? d.breakdown : [['Base score for any traveler', d.risk_score]];
  return head('Review queue', `${q.length} ${q.length === 1 ? 'claim needs' : 'claims need'} a person. The system never declines a claim on its own.`) + `
  <div class="split"><section class="panel"><div class="qlist">${q.map(x => `<a class="qitem ${x.id === d.id ? 'on' : ''}" href="#review/${esc(x.id)}"><div style="display:flex;justify-content:space-between"><b class="mono">${esc(x.id)}</b><span class="mono">${x.risk_score}</span></div><div class="mute" style="font-size:12px">Policy ${esc(x.policy_id)}</div></a>`).join('')}</div></section>
  <div class="stack"><section class="panel"><div class="ph"><h2>${esc(p.traveler)}</h2><span class="chip held push"><i></i>Needs a person</span></div><div class="pb">
      <dl class="kv"><dt>Policy</dt><dd class="mono">${esc(p.id)}</dd><dt>Flight</dt><dd>${esc(f.airline)} <span class="mono">${esc(f.code)}</span>, ${flightOf(f)}</dd><dt>Delay</dt><dd>${hm(d.delay_minutes)} (${d.delay_minutes} min)</dd><dt>Payout if approved</dt><dd class="mono"><b>${money(d.amount, cur)}</b> to ${esc(p.payout_account)}</dd></dl></div></section>
    <section class="panel"><div class="ph"><h2>Why it was held</h2><span class="push">${aiChip('AI flagged')}</span></div><div class="pb" style="display:grid;gap:14px">${gauge(d.risk_score, th)}${scoreBreakdown(parts, th)}<div class="aicard">${aiChip('KODA AI')}${aiText(d.explanation)}</div></div></section>
    <section class="panel"><div class="ph"><h2>Your decision</h2></div><div class="pb"><label class="lbl" for="note">Reason, saved in the audit log</label><textarea id="note" rows="3" class="field" placeholder="Why you approve or decline"></textarea>
      <div style="display:flex;gap:10px;margin-top:14px"><button class="btn primary act" data-id="${esc(d.id)}" data-a="approve">${ico('check')}Approve and pay</button><button class="btn danger act" data-id="${esc(d.id)}" data-a="decline">${ico('close')}Decline</button></div></div></section></div></div>`;
}

/* ---------- Baggage ---------- */
async function vBaggage(id) {
  const list = await api('/api/console/baggage');
  if (!list.length) return head('Baggage claims', 'Lost bag claims waiting for a decision.') + empty('luggage', 'No baggage claims yet', 'In the traveler app, add baggage cover and tap "My bag is lost".');
  const b = list.find(x => x.id === id) || list[0], d = b.decision, p = b.policy, th = b.rules.risk_threshold, cur = p.currency, done = d.status === 'paid' || d.status === 'declined';
  const parts = d.breakdown && d.breakdown.length ? d.breakdown : [['Base score for any traveler', d.risk_score]];
  return head('Baggage claims', 'Lost bag claims. The airline report and item list come from the traveler.') + `
  <div class="split"><section class="panel"><div class="qlist">${list.map(x => `<a class="qitem ${x.id === b.id ? 'on' : ''}" href="#baggage/${esc(x.id)}"><div style="display:flex;justify-content:space-between"><b class="mono">${esc(x.id)}</b>${outcomeChip({status: x.decision.status, decided_by: 'x'}).replace('Approved by a person', 'Paid')}</div><div class="mute" style="font-size:12px">${esc(x.policy.traveler)}, ${money(x.total, x.policy.currency)}</div></a>`).join('')}</div></section>
  <div class="stack"><section class="panel"><div class="ph"><h2>Lost bag, ${esc(p.traveler)}</h2><span class="push">${outcomeChip({status: d.status, decided_by: 'x'}).replace('Approved by a person', 'Paid')}</span></div><div class="pb">
      <dl class="kv"><dt>Policy</dt><dd class="mono">${esc(p.id)}</dd><dt>Flight</dt><dd class="mono">${esc(p.flight)}</dd><dt>Airline report</dt><dd class="mono">${esc(b.report_id)}</dd><dt>Bag tag</dt><dd class="mono">${esc(b.bag_tag)}</dd><dt>Payout to</dt><dd>${esc(p.payout_account)}</dd></dl></div></section>
    <section class="panel"><div class="ph"><h2>Items claimed</h2><span class="push mono">${money(b.total, cur)}</span></div><div class="tbl"><table><tbody>${b.items.map((i, n) => `<tr><td>${n + 1}. ${esc(i.name)}</td><td class="r mono">${money(i.amount, cur)}</td></tr>`).join('')}</tbody></table></div>
      <div class="pb mute" style="border-top:1px solid var(--line2)">Pays up to ${money(b.rules.lost_bag_payout, cur)}. Item values are declared by the traveler, so a person checks them.</div></section>
    <section class="panel"><div class="ph"><h2>Recommendation</h2></div><div class="pb" style="display:grid;gap:14px"><div class="disp" style="font-size:26px">${d.status === 'paid' ? 'Approved' : d.status === 'declined' ? 'Declined' : 'Approve'} ${money(d.amount, cur)}</div>${gauge(d.risk_score, th)}${scoreBreakdown(parts, th)}<div class="note info"><b>${esc(d.clause)}</b>. Benefit paid when a checked bag is declared lost by the airline.</div><div class="aicard">${aiChip('KODA AI')}${aiText(d.explanation)}</div>
      ${done ? '' : `<div style="display:flex;gap:10px"><button class="btn primary bact" data-id="${esc(b.id)}" data-a="approve">${ico('check')}Approve and pay</button><button class="btn danger bact" data-id="${esc(b.id)}" data-a="decline">${ico('close')}Decline</button></div>`}</div></section></div></div>`;
}

/* ---------- Rules ---------- */
function vRules() {
  const r = ov.rules, m = ov.rules_market, c = m.currency;
  const fields = [['delay_premium', `Delay cover price (${c})`], ['baggage_premium', `Baggage cover price (${c})`], ['delay_tier1_minutes', 'Tier 1 delay (minutes)'], ['delay_tier1_payout', `Tier 1 payout (${c})`], ['delay_tier2_minutes', 'Tier 2 delay (minutes)'], ['delay_tier2_payout', `Tier 2 payout (${c})`], ['cancel_payout', `Cancelled flight payout (${c})`], ['lost_bag_payout', `Lost bag payout (${c})`], ['risk_threshold', 'Pay automatically below risk score']];
  return head('Rules', 'Set by the insurer for each market. A change applies to the next flight delay, never to past decisions.') + `
  <div class="cols" style="grid-template-columns:minmax(0,420px) minmax(0,1fr)"><section class="panel"><div class="ph"><h2>Rules for a market</h2></div><div class="pb" style="display:grid;gap:12px">
      <div><label class="lbl" for="rmSel">Market</label><select id="rmSel" class="field">${ov.markets.map(x => `<option value="${x.code}" ${x.code === RM ? 'selected' : ''}>${esc(x.name)} (${esc(x.currency)})</option>`).join('')}</select></div>
      ${fields.map(([k, l]) => `<div style="display:grid;grid-template-columns:1fr 130px;gap:12px;align-items:center"><label for="r_${k}">${l}</label><input id="r_${k}" data-rule="${k}" type="number" min="0" value="${r[k]}" class="field mono" style="text-align:right"></div>`).join('')}
      <div style="display:flex;align-items:center;gap:12px;padding-top:6px;border-top:1px solid var(--line2)"><button id="saveRules" class="btn primary">Save rules</button><span id="saved" style="color:var(--green);font-size:13px"></span></div>
      <p class="mute" style="font-size:12px">Prices and payouts are demo values in US dollars. They are not actuarially priced.</p></div></section>
    <div class="stack"><section class="panel"><div class="ph"><h2>What a traveler is paid</h2><span class="push mute">${esc(m.name)}</span></div><div class="pb">${payoutCurve(r, c)}</div></section>
    <section class="panel"><div class="ph"><h2>Cover price against the top payout</h2></div><div class="pb">${barList([{label: 'Delay cover', value: r.delay_premium, text: money(r.delay_premium, c)}, {label: 'Top delay payout', value: r.delay_tier2_payout, text: money(r.delay_tier2_payout, c)}, {label: 'Baggage cover', value: r.baggage_premium, text: money(r.baggage_premium, c)}, {label: 'Lost bag payout', value: r.lost_bag_payout, text: money(r.lost_bag_payout, c)}])}</div></section></div></div>`;
}

/* ---------- Markets and law ---------- */
function vCompliance() {
  return head('Markets and law', 'How the product adapts to each market. This is a summary for the demo and not legal advice. A launch needs a licensed insurer and local counsel to confirm the current text of each law.') + `
  <div class="stack">${ov.markets.map(m => `<details class="panel mk" ${m.code === 'EU' ? 'open' : ''}><summary><h2 style="font-size:17px">${esc(m.name)}</h2><span class="chip">${esc(m.currency)}</span><span class="mute">${esc(m.regulator)}</span></summary>
    <div class="body"><dl class="kv"><dt>Payout options</dt><dd>${esc(m.rails.join(', '))} (simulated)</dd><dt>Tax</dt><dd>${esc(m.tax)}</dd></dl>
      ${m.statutory ? `<div class="note"><b>Airline obligations.</b> ${esc(m.statutory)}</div>` : ''}
      <div class="tbl"><table><thead><tr><th>Area</th><th>Law or rule</th><th>What KODA does</th></tr></thead><tbody>${m.notes.map(n => `<tr style="vertical-align:top"><td><b>${esc(n.area)}</b></td><td>${esc(n.law)}</td><td>${esc(n.handling)}</td></tr>`).join('')}</tbody></table></div></div></details>`).join('')}
    <section class="panel"><div class="ph"><h2>Rules that apply in every market</h2></div><div class="pb" style="display:grid;gap:10px">${(ov.markets[0].principles || []).map(t => `<div style="display:flex;gap:10px">${ico('check', 'mute')}<span>${esc(t)}</span></div>`).join('')}</div></section></div>`;
}

/* ---------- Performance ---------- */
function vPerformance() {
  const p = ov.performance, none = '<span class="faint">Run a test first</span>';
  const row = (m, manual, goal, res) => `<tr><td><b>${m}</b></td><td>${manual}</td><td>${goal}</td><td>${res}</td></tr>`;
  const ms = p.avg_decision_ms;
  return head('Performance', 'Manual baselines come from industry research. The last column is measured live from this prototype, so it changes as you run tests.') + `
  <div class="panel tbl" style="margin-bottom:20px"><table><thead><tr><th>Measure</th><th>Manual process today</th><th>KODA goal</th><th>Prototype result</th></tr></thead><tbody>
    ${row('Time to payout', 'About 14 days', 'Seconds after the event', p.decisions ? `<b class="mono">${p.seconds_to_payout}s</b> from event to payout, simulated` : none)}
    ${row('Documents from traveler', 'Forms, receipts, airline letter', 'None', p.decisions ? `<b class="mono">${p.documents_asked}</b> asked` : none)}
    ${row('Admin cost per policy', '$' + p.manual_cost_usd, 'Close to zero', p.covered_total ? `<b class="mono">$${p.admin_cost_usd}</b> across ${p.covered_total} ${p.covered_total === 1 ? 'policy' : 'policies'}` : none)}
    ${row('Decision time', 'Manual review', 'Seconds or less', ms ? `<b class="mono">${ms} ms</b> average over ${p.decisions} ${p.decisions === 1 ? 'decision' : 'decisions'}` : none)}
  </tbody></table></div>
  <div class="cols" style="grid-template-columns:repeat(3,minmax(0,1fr))">
    <section class="panel"><div class="ph"><h2>Paid with no human step</h2></div><div class="pb"><div class="disp" style="font-size:34px">${p.auto_paid}</div><p class="mute">${p.reviewed} needed a person</p></div></section>
    <section class="panel"><div class="ph"><h2>Cancellations paid</h2></div><div class="pb"><div class="disp" style="font-size:34px">${p.cancellations}</div><p class="mute">Cancelled flights decided by the same engine</p></div></section>
    <section class="panel"><div class="ph"><h2>Trips archived quietly</h2></div><div class="pb"><div class="disp" style="font-size:34px">${p.archived}</div><p class="mute">No payout, no promo, no spam</p></div></section>
  </div>
  <p class="mute" style="margin-top:16px;max-width:70ch">Admin cost counts only claims a person had to review, at the $41 manual rate. Time to payout is the step count of the simulated payout. Industry reference: AI first notice of loss cuts claim turnaround by about 30% (McKinsey, 2025). KODA removes the claim step for flight delays and cancellations.</p>`;
}

/* ---------- Audit ---------- */
async function vAudit() {
  const rows = await api('/api/console/audit');
  if (!rows.length) return head('Audit log', 'Every action by the system and by reviewers.') + empty('history', 'Nothing logged yet', 'Actions appear here as they happen.');
  return head('Audit log', 'The latest 50 actions by the system and by reviewers.') + `<div class="panel tbl"><table><thead><tr><th>Time</th><th>Policy</th><th>Event</th><th>Detail</th></tr></thead><tbody>
    ${rows.map(e => `<tr style="vertical-align:top"><td class="nowrap">${esc(new Date(e.ts * 1000).toLocaleString())}</td><td class="mono">${esc(e.policy_id || '')}</td><td><b>${esc(e.type)}</b></td><td class="mono" style="font-size:12px;word-break:break-all">${esc(e.detail)}</td></tr>`).join('')}</tbody></table></div>`;
}

/* ---------- events ---------- */
function bindAll() {
  const simSel = $('#simFlight'); if (simSel) simSel.onchange = () => { SIMSEL = simSel.value; };
  const runEvent = async (kind, btn) => {
    const m = parseInt($('#simMin').value, 10), code = $('#simFlight').value;
    if (!code) return fail('There is no flight to test yet.');
    if (kind === 'delay' && !(m >= 0 && m <= 2880)) return fail('Enter minutes between 0 and 2880.');
    btn.disabled = true;
    try {
      const fl = ov.flights.find(x => x.code === code);
      if (fl && !fl.travelers) { await api('/api/demo/cover-sample', 'POST', {flight: code}); toast('Added a sample traveler with cover on ' + code + ' for this test.', 'ok'); }
      if (kind === 'landed') {
        const w = await api('/api/webhook/flight-event', 'POST', {flight: code, event: 'landed', minutes: 0});
        toast(w.archived ? `${w.archived} trip${w.archived > 1 ? 's' : ''} archived. No payout, no message.` : 'Nothing to archive on this flight.', 'ok'); last = ''; refresh(); return;
      }
      const r = await api('/api/webhook/flight-event', 'POST', {flight: code, event: kind === 'cancel' ? 'cancelled' : 'delayed', minutes: kind === 'cancel' ? 0 : m});
      if (!r.results.length) toast('Nothing new to pay. This flight already paid at this level. Try a longer delay.', 'ok');
      else toast(r.results.some(x => x.status === 'upgraded') ? 'The delay grew into the next level. Payouts were topped up.' : `${r.results.length} decision${r.results.length > 1 ? 's' : ''} made.`, 'ok');
    } catch (e) { fail(e); }
    last = ''; refresh();
  };
  const simGo = $('#simGo'); if (simGo) { simGo.onclick = () => runEvent('delay', simGo); $('#simCancel').onclick = e => runEvent('cancel', e.currentTarget); $('#simOk').onclick = e => runEvent('landed', e.currentTarget); }
  document.querySelectorAll('.chk').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { const r = await api('/api/flights/' + encodeURIComponent(b.dataset.f) + '/refresh', 'POST'); toast(`Checked ${r.flight.code}. Delay is ${r.flight.delay_minutes} min.`, 'ok'); } catch (e) { fail(e); }
    last = ''; refresh();
  });
  const rm = $('#rmSel'); if (rm) rm.onchange = () => { RM = rm.value; last = ''; refresh(); };
  const fq = $('#fq'); if (fq) fq.oninput = () => { FQ = fq.value; last = ''; const pos = fq.selectionStart; refresh().then(() => { const n = $('#fq'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }); };
  document.querySelectorAll('.act').forEach(b => b.onclick = async () => { b.disabled = true; try { await api('/api/console/review/' + b.dataset.id, 'POST', {action: b.dataset.a, note: ($('#note') || {}).value || ''}); toast(b.dataset.a === 'approve' ? 'Approved and paid.' : 'Declined.', 'ok'); } catch (e) { fail(e); } last = ''; refresh(); });
  document.querySelectorAll('.bact').forEach(b => b.onclick = async () => { b.disabled = true; try { await api('/api/console/baggage/' + b.dataset.id, 'POST', {action: b.dataset.a}); toast(b.dataset.a === 'approve' ? 'Approved and paid.' : 'Declined.', 'ok'); } catch (e) { fail(e); } last = ''; refresh(); });
  const sv = $('#saveRules');
  if (sv) sv.onclick = async () => {
    const values = {}; document.querySelectorAll('[data-rule]').forEach(i => values[i.dataset.rule] = +i.value);
    if (Object.values(values).some(v => !Number.isFinite(v))) return fail('Enter a number in every field.');
    $('#saved').textContent = '';
    try { await api('/api/console/rules?market=' + RM, 'PUT', {values}); $('#saved').textContent = 'Saved. Applies to the next delay.'; last = ''; ov = await api('/api/console/overview?market=' + RM); } catch (e) { fail(e); }
  };
}
$('#aiOn').innerHTML = aiChip('AI on');
$('#reset').onclick = async () => { try { await api('/api/demo/reset', 'POST'); toast('Demo data reset.', 'ok'); } catch (e) { fail(e); } last = ''; refresh(); };
// Poll so a claim made in the traveler app shows up. Skip while a form is in use so typing is never wiped.
setInterval(() => { if (!document.hidden && route.split('/')[0] !== 'rules' && !document.activeElement?.matches('textarea,input,select')) refresh().catch(() => {}); }, location.search.includes('embed') ? 1500 : 3000);
refresh();
</script>
</body>
