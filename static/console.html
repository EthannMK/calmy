<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<title>KODA Console</title>
<link rel="stylesheet" href="/static/fonts.css">
<link rel="stylesheet" href="/static/ui.css">
<style>
  .gate{position:fixed;inset:0;z-index:50;background:var(--bg,#F4F6F9);display:grid;place-items:center;padding:24px;overflow:auto}
  .gate[hidden]{display:none}
  .gbox{width:100%;max-width:440px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 12px 40px rgba(20,40,80,.08);display:grid;gap:14px}
  .gbox h1{margin:0;font-size:24px}.gbox p{margin:0;color:var(--mute);font-size:14px;line-height:1.5}
  .gdemo{display:grid;gap:6px}.gdemo button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;font:inherit;cursor:pointer}
  .gdemo button.on{border-color:var(--cobalt);background:var(--cobalt-t)}
  .gcode{font-size:22px;letter-spacing:.3em;text-align:center}
  .gback{justify-self:start;color:var(--cobalt);font-weight:600;font-size:14px;background:none;border:0;cursor:pointer;display:inline-flex;gap:4px;align-items:center;padding:0}
  .app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
  .rail{background:var(--navy);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .rail .brand{display:flex;align-items:center;gap:10px;padding:2px 8px}
  .rail .brand small{display:block;font-size:11px;color:var(--navy-mute);margin-top:1px}
  .grp{display:grid;gap:2px;margin-bottom:18px}.grp h4{margin:0 0 4px;padding:0 10px;font-size:12px;font-weight:500;color:var(--navy-mute)}
  .nav a{display:flex;align-items:center;gap:11px;height:36px;padding:0 10px;border-radius:6px;color:#C9D4E3;font-size:14px;font-weight:500;position:relative}
  .nav a:hover{background:var(--navy2);text-decoration:none;color:#fff}
  .nav a.on{background:var(--navy2);color:#fff}.nav a.on::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--amber)}
  .nav a .n{margin-left:auto;background:var(--amber);color:var(--navy);font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px}
  .rail .foot{margin-top:auto;padding:0 8px;font-size:12px;color:var(--navy-mute);display:grid;gap:8px}
  .rail .foot button{color:#C9D4E3;text-align:left;font-size:13px;font-weight:500;display:flex;gap:8px;align-items:center}.rail .foot button:hover{color:#fff}
  .main{display:flex;flex-direction:column;min-width:0}
  .top{position:sticky;height:56px;background:var(--panel);border-bottom:1px solid var(--line);padding:0 28px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
  .top .crumb{font-size:13px;color:var(--mute)}.top .env{margin-left:auto;display:flex;align-items:center;gap:14px}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center}
  .page{padding:28px;max-width:1360px;width:100%;margin:0 auto;flex:1}
  .pagehead{margin-bottom:22px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .pagehead h1{font-size:30px}.pagehead p{color:var(--mute);margin-top:6px;max-width:70ch}.pagehead .push{margin-left:auto}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr)}
  .kpis>div{padding:18px 20px;border-left:1px solid var(--line)}.kpis>div:first-child{border-left:0}
  .kpis .k{font-size:13px;color:var(--mute);display:flex;justify-content:space-between;align-items:center}
  .kpis .v{font-family:'Figtree',sans-serif;font-weight:700;font-size:36px;letter-spacing:-.03em;margin-top:8px;line-height:1}
  .kpis .s{font-size:12px;color:var(--mute);margin-top:8px}
  .cols{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
  .stack{display:grid;gap:20px}
  /* departure board */
  .board{background:var(--navy);color:#fff;border-radius:var(--r);overflow:hidden}
  .board .bh{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--navy-line)}
  .board .bh h2{font-size:16px}.board .bh span{color:var(--navy-mute);font-size:13px;margin-left:auto}
  @media(max-width:1000px){#aiDesk{grid-template-columns:1fr!important}}
  .brow{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:6px 16px;padding:14px 18px;border-bottom:1px solid var(--navy-line)}
  .brow:last-of-type{border-bottom:0}
  .brow .code{font-family:'Geist Mono',monospace;font-weight:600;color:var(--amber);font-size:18px;letter-spacing:.02em}
  .brow .route{font-family:'Geist Mono',monospace;font-size:15px;letter-spacing:.04em;display:flex;align-items:center;gap:10px}
  .brow .route em{font-style:normal;color:var(--navy-mute);font-family:Geist,sans-serif;font-size:12px;letter-spacing:0}
  .brow .st{justify-self:end;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
  .brow .st i{width:8px;height:8px;border-radius:50%;display:block}
  .brow .meta{grid-column:2/4;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--navy-mute)}
  .brow .meta a,.brow .meta button{color:var(--amber);font-weight:600}
  .brow .trk{grid-column:1/4}
  .boardempty{padding:34px 18px;color:var(--navy-mute);text-align:center}
  .tool{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 18px;border-top:1px solid var(--navy-line);background:var(--navy2);font-size:13px;color:#C9D4E3}
  .tool .field{background:var(--navy);border-color:var(--navy-line);color:#fff;width:auto;height:34px}
  .tool .field.min{width:84px;text-align:right}
  .tool .btn{height:34px;background:var(--amber);border-color:var(--amber);color:var(--navy)}
  .tool .btn:hover{background:#FFC24D}
  /* lists */
  .qlist{display:grid;gap:0}.qitem{display:block;padding:12px 14px;border-bottom:1px solid var(--line2);color:inherit}.qitem:hover{background:#F8FAFD;text-decoration:none}
  .qitem.on{background:var(--cobalt-t);box-shadow:inset 3px 0 0 var(--cobalt)}
  .split{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
  .tl{display:grid}.tl>div{display:grid;grid-template-columns:22px 1fr auto;gap:12px;padding-bottom:18px;position:relative}
  .tl>div:not(:last-child)::before{content:'';position:absolute;left:10px;top:22px;bottom:2px;width:2px;background:var(--line)}
  .tl .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--green);color:var(--green);display:grid;place-items:center;background:#fff}
  .tl .dot.wait{border-color:var(--amber);color:var(--amber-d);background:var(--amber-t)}
  .tl .dot .ms{font-size:14px}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:8px 14px;font-size:13px}.kv dt{color:var(--mute)}.kv dd{margin:0}
  .search{position:relative;max-width:300px}.search .ms{position:absolute;left:10px;top:10px;color:var(--faint);font-size:18px}.search input{padding-left:34px}
  details.mk summary{cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:16px 18px;list-style:none}
  details.mk summary::-webkit-details-marker{display:none}
  details.mk summary::after{content:'expand_more';font-family:'Material Symbols Outlined';margin-left:auto;font-size:20px;color:var(--mute)}
  details.mk[open] summary::after{content:'expand_less'}
  details.mk .body{padding:0 18px 18px;display:grid;gap:14px;font-size:13px}
  .empty{text-align:center;padding:56px 20px;color:var(--mute)}.empty .ms{font-size:36px;color:var(--faint)}.empty h2{font-size:18px;color:var(--ink);margin:8px 0 4px}
  .rulescols{grid-template-columns:minmax(0,420px) minmax(0,1fr)}
  .menu{display:none}
  .who{display:flex;align-items:center;gap:10px;border-radius:999px;padding:3px 4px 3px 12px;cursor:pointer;background:none;border:1px solid transparent;text-align:right;font:inherit;color:inherit}
  .who:hover,.who[aria-expanded=true]{border-color:var(--line);background:var(--line2)}
  .pop{position:absolute;right:20px;top:54px;width:300px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(7,28,63,.18);padding:8px;z-index:50;display:none}
  .pop.open{display:block}.pop h4{margin:8px 10px 4px;font-size:12px;color:var(--mute);font-weight:600}
  .pop button,.pop a{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;font-size:14px;text-align:left;color:var(--ink)}
  .pop button:hover,.pop a:hover{background:var(--line2);text-decoration:none}.pop .me{background:var(--cobalt-t)}
  .pop .avatar{width:28px;height:28px;font-size:11px}
  .tabsx{display:flex;gap:6px;flex-wrap:wrap}.tabsx button{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600}
  .tabsx button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .form{display:grid;gap:12px}.form label{display:grid;gap:5px;font-size:13px;font-weight:600}.form label small{font-weight:400;color:var(--mute)}
  .sw{display:flex;align-items:center;gap:10px;font-size:14px}.sw input{width:18px;height:18px}
  .mini{display:grid;gap:2px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fff}.mini b{font:700 24px Figtree,sans-serif;letter-spacing:-.02em}.mini span{font-size:12px;color:var(--mute)}
  @media(max-width:1100px){.grid2,.grid3{grid-template-columns:1fr}}
  @media(max-width:520px){.pop{right:8px;left:8px;width:auto}}
  @media(max-width:1100px){.cols,.split,.rulescols{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.kpis>div:nth-child(3){border-left:0}.kpis>div:nth-child(n+3){border-top:1px solid var(--line)}}
  @media(max-width:860px){.app{grid-template-columns:1fr}.rail{position:static;height:auto;flex-direction:row;align-items:center;gap:8px;padding:10px 12px;overflow-x:auto}
    .rail .grp h4,.rail .foot{display:none}.rail nav{display:flex;gap:2px}.rail .grp{display:flex}.nav a{white-space:nowrap;padding:0 12px}.nav a .ms{display:none}.nav a.on::before{display:none}
    .top{padding:0 16px}.page{padding:16px}.brow{grid-template-columns:1fr}.brow .meta,.brow .trk{grid-column:1}.brow .st{justify-self:start}}
</style>
</head>
<body>
<div class="gate" id="gate" hidden></div>
<div class="app">
  <aside class="rail">
    <div class="brand"><div><span class="wordmark" role="img" aria-label="KODA"><i>K</i><i>O</i><i>D</i><i>A</i></span><small>Claims desk</small></div></div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    
  </aside>
  <div class="main">
    <header class="top"><span class="crumb" id="crumb"></span>
      <div class="env"><span id="aiOn"></span><button class="who" id="who" aria-haspopup="true" aria-expanded="false" aria-label="Account menu"></button></div>
      <div class="pop" id="pop" role="menu"></div></header>
    <main id="view" class="page"></main>
  </div>
</div>
<script src="/static/ui.js"></script>
<script>
const usd2 = n => 'S$' + Number(n).toFixed(2);
let route = location.hash.slice(1) || 'overview', last = '', ov = null, RM = 'TH', FQ = '';
let INV = {}, ME = null, STAFFL = [], CU = {cover: '', payout: '', source: ''}, PTAB = 'partners', PAIR = '';
let refreshing = false, liveAt = 0, LIVE = {}, EXP = null, COP = {}, CHAT = {}, DRAFT = {};
let CHATW = 0, CDRAFT = {};   // chats waiting for a person, and the reply being typed in each
const GROUPS = [
  ['Operations', [['overview', 'dashboard', 'Overview'], ['review', 'rule', 'Review queue'], ['chats', 'support_agent', 'Conversations'], ['decisions', 'gavel', 'Decisions'], ['baggage', 'luggage', 'Baggage claims']]],
  ['Book of business', [['customers', 'person', 'Customers'], ['policies', 'verified_user', 'Policies'], ['points', 'paid', 'Points and partners'], ['exposure', 'bolt', 'Exposure forecast']]],
  ['Governance', [['rules', 'tune', 'Rules'], ['compliance', 'balance', 'Markets and law'], ['audit', 'history', 'Audit log']]],
];
const TITLES = {chats: 'Conversations', customers: 'Customers', points: 'Points and partners', profile: 'My profile', exposure: 'Exposure forecast', overview: 'Overview', policies: 'Policies', decisions: 'Decisions', review: 'Review queue', baggage: 'Baggage claims', rules: 'Rules', compliance: 'Markets and law', audit: 'Audit log'};
window.onhashchange = () => { route = location.hash.slice(1) || 'overview'; last = ''; FQ = ''; refresh(); };
const flightOf = f => `${esc(f.origin)} to ${esc(f.dest)}`;
const mk = code => (ov.markets.find(m => m.code === code) || {name: code, currency: ''});

function head(title, sub = '', right = '') { return `<div class="pagehead"><div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div>${right ? `<div class="push">${right}</div>` : ''}</div>`; }
function empty(icon, t, s) { return `<div class="panel empty"><span class="ms">${icon}</span><h2>${t}</h2><p>${s}</p></div>`; }
const searchBox = ph => `<label class="search"><span class="ms">search</span><input id="fq" class="field" placeholder="${ph}" value="${esc(FQ)}" aria-label="${ph}"></label>`;
const matchQ = (...v) => !FQ || v.join(' ').toLowerCase().includes(FQ.toLowerCase());

async function refresh() {
  if (refreshing) return; refreshing = true;
  try { await paint(); } finally { refreshing = false; }
}
async function paint() {
  const base = route.split('/')[0], needExp = base === 'overview' || base === 'exposure';
  // One round trip for everything the page needs, instead of one after another.
  const [o, lv, ex, me, sl] = await Promise.all([
    api('/api/console/overview?market=' + RM),
    Date.now() - liveAt > 20000 ? api('/api/live/status').catch(() => LIVE) : LIVE,
    needExp ? api('/api/console/exposure').catch(() => null) : EXP,
    api('/api/console/staff/me'), api('/api/console/staff'),
  ]);
  ME = me; STAFFL = sl; if (!store.get('koda.staff')) store.set('koda.staff', me.id); drawWho();
  ov = o; LIVE = lv; EXP = ex;
  const ai = $('#aiOn'); if (ai) { const st = ov.ai_status || 'live'; ai.innerHTML = aiChip(st === 'live' ? 'AI on' : st === 'fallback' ? 'AI fallback' : 'AI off');
    ai.title = st === 'live' ? 'Gemini writes explanations and drafts.' : st === 'fallback' ? 'Gemini did not answer last time, so template text is used. Decisions are unaffected.' : 'No Google Cloud project is set, so template text is used. Decisions are unaffected.'; } if (Date.now() - liveAt > 20000) liveAt = Date.now();
  const held = ov.stats.held, bags = ov.stats.bag_waiting;
  $('#nav').innerHTML = GROUPS.map(([g, items]) => `<div class="grp"><h4>${g}</h4>${items.map(([k, ic, t]) => { const n = k === 'review' ? held : k === 'baggage' ? bags : k === 'chats' ? CHATW : 0; return `<a href="#${k}" class="${base === k ? 'on' : ''}" ${base === k ? 'aria-current="page"' : ''}>${ico(ic)}<span>${t}</span>${n ? `<span class="n">${n}</span>` : ''}</a>`; }).join('')}</div>`).join('');
  const [page, arg] = route.split('/');
  $('#crumb').textContent = 'KODA  /  ' + (TITLES[page] || 'Overview');
  let html;
  try { html = await ({chats: vChats, overview: vOverview, exposure: vExposure, policies: vPolicies, decisions: vDecisions, customers: vCustomers, points: vPoints, profile: vProfile, review: vReview, baggage: vBaggage, rules: vRules, compliance: vCompliance, audit: vAudit}[page] || vOverview)(arg); }
  catch (e) { html = empty('error', 'Could not load this page', esc(e)); }
  if (html !== last) { $('#view').innerHTML = `<div class="rise">${html}</div>`; last = html; bindAll(); applyRole(); typeAll($('#view')); }
}

/* ---------- Overview ---------- */
function vOverview() {
  const s = ov.stats, o = ov.outcomes;
  const share = s.paid_count + s.held ? s.auto_paid + ' of ' + (s.paid_count + s.held) : 'None yet';
  const tracked = [...ov.flights].sort((a, b) => (b.travelers > 0) - (a.travelers > 0));
  const covered = tracked.filter(f => f.travelers > 0).length;
  const kpi = (k, ic, v, sub) => `<div><div class="k">${k}${ico(ic, 'mute')}</div><div class="v">${v}</div><div class="s">${sub}</div></div>`;
  const recent = ov.decisions.filter(d => d.kind === 'delay').slice(0, 6);
  const oc = ov.outcomes, decidedAll = oc.auto + oc.reviewed + oc.held + oc.declined, fastPct = decidedAll ? Math.round(oc.auto * 100 / decidedAll) : 0;
  const secs = ov.decisions.filter(d => d.kind === 'delay' && d.status === 'paid' && d.seconds != null).map(d => d.seconds), avg = secs.length ? Math.round(secs.reduce((a, b) => a + b, 0) / secs.length) : null;
  return head('Overview', 'Cover sold, flights being watched and every payout decision, across all markets. Totals are in Singapore dollars.') + `
  <div class="panel kpis" style="margin-bottom:20px">${kpi('Active policies', 'verified_user', num(s.active), s.premium_usd ? 'Premium written ' + usd(s.premium_usd) : 'No cover sold yet')}
    ${kpi('Paid out', 'payments', usd(s.paid_amount_usd), s.paid_count + (s.paid_count === 1 ? ' payout' : ' payouts'))}
    ${kpi('Held for review', 'schedule', s.held, s.held ? '<a href="#review">Open the review queue</a>' : 'Nothing is waiting for a person')}
    ${kpi('Auto-paid claims', 'bolt', share, avg == null ? 'Decision time appears with the first claim' : 'Average decision ' + avg + ' seconds, ' + fastPct + '% of decisions paid with no human step')}</div>
  ${bookStrip()}
  ${exposureStrip()}
  <div class="cols"><div class="stack">
    <section class="board" aria-label="Flight watch"><div class="bh"><h2>Flight watch</h2><span>${covered} ${covered === 1 ? 'flight has' : 'flights have'} cover</span></div>
      ${tracked.length ? tracked.slice(0, 4).map(f => {
        const m = mk(f.market), late = f.delay_minutes > 0, r = ov.rules_all[f.market] || ov.rules;
        return `<div class="brow"><div class="code">${esc(f.code)}</div>
          <div class="route">${esc(f.origin)} <span class="ms" style="color:var(--amber);font-size:16px">flight_takeoff</span> ${esc(f.dest)} <em>${esc(f.origin_city)} to ${esc(f.dest_city)}</em></div>
          <div class="st"><i style="background:${late ? 'var(--amber)' : '#34D399'}"></i>${late ? 'Delayed ' + hm(f.delay_minutes) : 'On time'}</div>
          <div class="meta"><span>${esc(f.depart_label)}</span><span>${esc(m.name)}, ${esc(m.currency)}</span><span>${f.travelers} covered ${f.travelers === 1 ? 'traveler' : 'travelers'}</span><span>${f.source === 'live' ? 'Live status, updated ' + ago(f.fetched_at) + ' <button class="chk" data-f="' + esc(f.code) + '">Refresh</button>' : 'Scheduled'}</span></div>
          <div class="trk">${delayTrack(f.delay_minutes, r, m.currency, true).replace('class="dtrack tall', 'class="dtrack compact')}</div></div>`;
      }).join('') : '<div class="boardempty">No flights loaded.</div>'}
</section>
    <section class="panel"><div class="ph"><h2>Recent decisions</h2><a class="push" href="#decisions">All decisions</a></div>
      ${recent.length ? `<div class="tbl"><table><thead><tr><th>Decision</th><th>Policy</th><th>Outcome</th><th class="r">Amount</th></tr></thead><tbody>${recent.map(d => `<tr class="click" onclick="location.hash='${d.status === 'held' ? 'review/' + esc(d.id) : 'decisions/' + esc(d.policy_id)}'"><td class="mono">${esc(d.id)}</td><td class="mono">${esc(d.policy_id)}</td><td>${outcomeChip(d)}</td><td class="r mono">${money(d.amount, d.currency)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="pb mute">No decisions yet. A delay or cancellation that reaches a payout rule creates one.</div>'}</section>
  </div><div class="stack">
    <section class="panel"><div class="ph"><h2>Claim outcomes</h2></div><div class="pb">${outcomeBar(o)}</div></section>
    <section class="panel"><div class="ph"><h2>Paid out by market</h2></div><div class="pb">${ov.by_market.length ? barList(ov.by_market.map(m => ({label: mk(m.market).name, value: m.usd, text: usd(m.usd)}))) : '<p class="mute">No payouts yet.</p>'}</div></section>
  </div></div>`;
}
function bookStrip() {
  const s = ov.stats; if (s.customers == null) return '';
  return `<div class="panel" style="padding:14px 20px;margin-bottom:20px;display:flex;gap:28px;flex-wrap:wrap;align-items:center">
    <span><b>${num(s.customers)}</b> <a href="#customers">customers</a></span><span><b>${num(s.bookings)}</b> bookings</span>
    <span><b>${num(s.uncovered_bookings)}</b> bookings with no cover</span>
    <span>${s.delayed_no_cover ? `<b>${s.delayed_no_cover}</b> delayed flights where the traveler had no delay cover` : 'No delayed traveler is missing cover'}</span></div>`;
}
function exposureStrip() {
  if (!EXP) return '';
  const hot = EXP.flights.filter(f => f.level === 'high' && f.covered > 0);
  return `<section class="panel" style="margin-bottom:20px"><div class="ph"><h2>Exposure forecast</h2>${aiChip('KODA AI')}<a class="push" href="#exposure">Open</a></div>
    <div class="pb" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px">
      <div><div class="mute" style="font-size:12px">Expected payouts, covered trips</div><div class="disp" style="font-size:22px">${usd2(EXP.expected_usd)}</div></div>

async function vDecisions(pid) {
  if (!pid) {
    const list = ov.decisions.filter(d => d.kind === 'delay' && d.status !== 'held' && matchQ(d.id, d.policy_id, d.status, d.traveler, d.flight));
    return head('Decisions', 'Every delay decision, with the reason behind it.', searchBox('Search by name, flight or policy')) + (list.length ?
      `<div class="panel tbl"><table><thead><tr><th>Traveler</th><th>Flight</th><th>What happened</th><th>Outcome</th><th class="r">Amount</th></tr></thead><tbody>${list.map(d => `<tr class="click" onclick="location.hash='decisions/${esc(d.policy_id)}'">
        <td>${esc(d.traveler || '')}<br><small class="mute mono" style="font-size:11px">${esc(d.policy_id)}</small></td>
        <td class="mono">${esc(d.flight || '')}</td>
        <td>${d.trigger === 'cancel' ? 'Cancelled' : d.trigger === 'recheck' ? 'Traveler asked us to check again' : hm(d.delay_minutes || 0) + ' late'}</td>

      empty('gavel', 'No decisions yet', 'Decisions appear when a flight is delayed or cancelled.'));
  }
  let info; try { info = await api('/api/console/decision/' + pid); } catch (e) { return head('Decisions') + empty('gavel', 'That policy is not here any more', 'It may have been cleared by a reset. <a href="#decisions">Back to all decisions</a>.'); }

    head(declined ? `Declined ${money(d.amount, cur)}` : `Paid ${money(d.amount, cur)}`, `${esc(p.traveler)} on ${esc(f.airline)} <span class="mono">${esc(f.code)}</span>, ${flightOf(f)}`, chip) + `
  <div class="panel" style="margin-bottom:20px"><div class="ph"><h2>${cx ? 'Cancellation event' : 'Delay against the payout rules'}</h2><span class="push mute">${esc(mkt.name)}, ${esc(cur)}</span></div><div class="pb">${cx ? `<div class="note info"><b>${esc(f.code)} was cancelled.</b> Rule: cancelled flights pay ${money(rules.cancel_payout, cur)} at once, with no waiting tier.</div>` : delayTrack(d.delay_minutes, rules, cur)}</div></div>

    <div class="stack"><section class="panel"><div class="ph"><h2>Risk score</h2><span class="push">${aiChip('AI scored')}</span></div><div class="pb">${gauge(d.risk_score, th)}<div style="height:12px"></div>${scoreBreakdown(parts, th)}</div></section>

/* Gemini rewrites the draft in the background so the page never waits on it. A draft the reviewer has already edited is kept. */
function upgradeCopilot(id) {
  api('/api/console/copilot/' + id + '?ai=1').then(r => {
    if (r.ai && DRAFT[id] === COP[id].draft) { DRAFT[id] = r.draft; }
    if (r.ai) { COP[id] = r; last = ''; }
  }).catch(() => {});
}

/* ---------- Points and partners ---------- */
async function vPoints() {
  const d = await api('/api/console/points');
  const airports = [...new Set(d.partners.map(p => p.airport))].sort();
  if (!PAIR || !airports.includes(PAIR)) PAIR = airports.includes('SIN') ? 'SIN' : airports[0];
  const ps = d.partners.filter(p => p.airport === PAIR);
  const kind = {food: 'Food and drink', lounge: 'Lounge', transport: 'Taxi and car rental', hotel: 'Hotel', connect: 'SIM, calls and messages', extras: 'Extras'};
  const tab = (k, t) => `<button data-ptab="${k}" class="${PTAB === k ? 'on' : ''}">${t}</button>`;
  const kp = (t, v, s) => `<div class="mini"><span>${t}</span><b>${v}</b><span>${s}</span></div>`;
  const list = PTAB === 'partners'
    ? `<div class="panel tbl"><div class="ph"><h2>Partners at</h2><select id="pair" class="field" style="width:auto;height:34px">${airports.map(a => `<option ${a === PAIR ? 'selected' : ''}>${a}</option>`).join('')}</select><span class="mute" style="margin-left:auto">${ps.filter(p => p.accepts).length} of ${ps.length} accept KODA points</span></div><table><thead><tr><th>Outlet</th><th>Type</th><th>Terminal</th><th>Opens</th><th class="r">Used</th><th>Accepts points</th></tr></thead><tbody>
      ${ps.map(p => `<tr><td>${esc(p.name)}</td><td>${esc(kind[p.category] || p.kind)}</td><td>${esc(p.terminal || '')}</td><td class="mono">${esc(p.opens)} to ${esc(p.closes)}</td><td class="r">${p.used}</td><td><label class="sw"><input type="checkbox" data-accept="${esc(p.id)}" ${p.accepts ? 'checked' : ''} aria-label="${esc(p.name)} accepts points"> ${p.accepts ? 'Yes' : 'No'}</label></td></tr>`).join('')}</tbody></table></div>`
    : `<div class="panel tbl"><div class="ph"><h2>Recent spending and cash-outs</h2></div>${d.activity.length ? `<table><thead><tr><th>When</th><th>Customer</th><th>What</th><th>Voucher</th><th class="r">Points</th></tr></thead><tbody>${d.activity.map(t => `<tr><td class="nowrap">${esc(new Date(t.created_at * 1000).toLocaleString())}</td><td><a href="#customers/${esc(t.customer_id)}">${esc(t.name)}</a></td><td>${esc(t.label)}${t.code ? ` <span class="mono mute" style="font-size:12px">${esc(t.code)}</span>` : ''}</td>
      <td>${t.kind === 'cashout' ? '<span class="mute">Cash to a card</span>' : t.voucher === 'used' ? '<span class="chip paid"><i></i>Scanned at the outlet</span>' : '<span class="chip held"><i></i>Not scanned yet</span>'}</td>
      <td class="r mono">${num(t.points)}</td></tr>`).join('')}</tbody></table>` : '<div class="pb mute">Nothing spent yet.</div>'}</div>`;
  return head('Points and partners', `Payouts arrive as KODA points by default. Each customer can spend points at airport partners or cash them out to a saved card or bank. ${num(d.per_usd)} points are worth ${usd2(1)} to spend, and a 25% bonus is added when a payout is paid as points.`) + `
  <div class="grid3" style="grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px">${kp('Points owed to customers', num(d.liability_points), 'About ' + usd2(d.liability_usd) + ' if all were cashed out')}${kp('Customers holding points', d.holders, 'of ' + ov.stats.customers)}${kp('Spent at partners', num(d.spent), 'points')}${kp('Cashed out', num(d.cashed), 'points, at ' + Math.round(d.cashout_rate * 100) + '% of spend value')}</div>
  <div class="tabsx" style="margin-bottom:14px">${tab('partners', 'Partner directory')}${tab('activity', 'Spending and cash-outs')}</div>${list}`;
}

/* ---------- events ---------- */
function bindAll() {
  document.querySelectorAll('.chk').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { const r = await api('/api/flights/' + encodeURIComponent(b.dataset.f) + '/refresh', 'POST'); toast(`Checked ${r.flight.code}. Delay is ${r.flight.delay_minutes} min.`, 'ok'); } catch (e) { fail(e); }
    last = ''; refresh();
  });
  const dr = $('#draft'); if (dr) dr.oninput = () => { DRAFT[dr.dataset.d] = dr.value; };
  const cm = $('#cmsg'); if (cm) cm.oninput = () => { CDRAFT[cm.dataset.c] = cm.value; };
  const ct = $('#ctrans'); if (ct) ct.scrollTop = ct.scrollHeight;   // newest message in view
  document.querySelectorAll('.creply').forEach(b => b.onclick = async () => {
    const id = b.dataset.c, box = $('#cmsg'), text = (box ? box.value : '').trim();
    if (text.length < 2) return toast('Write a message first.', true);
    b.disabled = true;
    try { await api('/api/console/chats/' + id, 'POST', {text}); CDRAFT[id] = ''; toast('Sent to the traveler.', 'ok'); } catch (e) { fail(e); }
    last = ''; refresh();
  });
  document.querySelectorAll('.cact').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await api('/api/console/chats/' + b.dataset.c, 'POST', {action: b.dataset.a}); toast(b.dataset.a === 'take_over' ? 'You are in this chat now.' : 'Handed back to the assistant.', 'ok'); } catch (e) { fail(e); }
    last = ''; refresh();
  });
  const sd = $('#sendDraft'); if (sd) sd.onclick = async () => {
    const text = (($('#draft') || {}).value || '').trim(); if (text.length < 5) return fail('Write the question for the traveler first.');
    sd.disabled = true;
    try { await api('/api/console/review/' + sd.dataset.id + '/ask', 'POST', {text}); toast('Sent to the traveler. Their reply will arrive in Conversations.', 'ok'); } catch (e) { fail(e); }
    last = ''; refresh();
  };
  const cd = $('#copyDraft'); if (cd) cd.onclick = async () => { try { await navigator.clipboard.writeText(($('#draft') || {}).value || ''); toast('Message copied.', 'ok'); } catch (e) { toast('Select the text and copy it.', 'ok'); } };
  const askGo = async () => {
    const i = $('#ask'); if (!i || i.value.trim().length < 2) return;
    const id = i.dataset.d, q = i.value.trim(); CHAT[id].push({who: 'you', text: q}); i.value = '';
    try { const r = await api('/api/console/copilot', 'POST', {decision: id, question: q}); CHAT[id].push({who: 'ai', text: r.answer}); } catch (e) { fail(e); }
    last = ''; refresh();
  };
  const ab = $('#askBtn'); if (ab) ab.onclick = askGo; const ak = $('#ask'); if (ak) ak.onkeydown = e => { if (e.key === 'Enter') askGo(); };
  const rm = $('#rmSel'); if (rm) rm.onchange = () => { RM = rm.value; last = ''; refresh(); };
  const fq = $('#fq'); if (fq) fq.oninput = () => { FQ = fq.value; last = ''; const pos = fq.selectionStart; refresh().then(() => { const n = $('#fq'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }); };
  document.querySelectorAll('.act').forEach(b => b.onclick = async () => { b.disabled = true; try { await api('/api/console/review/' + b.dataset.id, 'POST', {action: b.dataset.a, note: ($('#note') || {}).value || ''}); toast(b.dataset.a === 'approve' ? 'Approved and paid.' : 'Declined.', 'ok'); } catch (e) { fail(e); } last = ''; refresh(); });
  document.querySelectorAll('.bact').forEach(b => b.onclick = async () => { b.disabled = true; try { await api('/api/console/baggage/' + b.dataset.id, 'POST', {action: b.dataset.a}); toast(b.dataset.a === 'approve' ? 'Approved and paid.' : 'Declined.', 'ok'); } catch (e) { fail(e); } last = ''; refresh(); });
  document.querySelectorAll('[data-cu]').forEach(b => b.onclick = () => { const [k, v] = b.dataset.cu.split(':'); CU[k] = v; last = ''; refresh(); });
  document.querySelectorAll('[data-ptab]').forEach(b => b.onclick = () => { PTAB = b.dataset.ptab; last = ''; refresh(); });
  const pa = $('#pair'); if (pa) pa.onchange = () => { PAIR = pa.value; last = ''; refresh(); };
  document.querySelectorAll('[data-accept]').forEach(i => i.onchange = async () => { try { await api('/api/console/partners/' + i.dataset.accept, 'PUT', {accepts: i.checked}); toast(i.checked ? 'This outlet now accepts KODA points.' : 'This outlet no longer accepts KODA points.', 'ok'); } catch (e) { fail(e); } last = ''; refresh(); });
  const ps = $('#pfSave'); if (ps) ps.onclick = async () => {
    try { ME = await api('/api/console/staff/' + ME.id, 'PUT', {name: $('#pfName').value, title: $('#pfTitle').value, email: $('#pfEmail').value, notify: $('#pfNotify').checked}); $('#pfMsg').textContent = 'Saved.'; toast('Profile saved.', 'ok'); last = ''; await refresh(); } catch (e) { fail(e); }
  };
  const asb = $('#asAdd'); if (asb) asb.onclick = async () => { try { await api('/api/console/airspace', 'POST', {airport: $('#asAp').value, label: $('#asLabel').value, level: $('#asLvl').value}); toast('Alert added. The forecast now counts it.', 'ok'); EXP = await api('/api/console/exposure'); } catch (e) { return fail(e); } last = ''; refresh(); };
  document.querySelectorAll('[data-asdel]').forEach(b => b.onclick = async () => { try { await api('/api/console/airspace/' + b.dataset.asdel, 'DELETE'); toast('Alert removed.', 'ok'); EXP = await api('/api/console/exposure'); } catch (e) { fail(e); } last = ''; refresh(); });
  const ig = $('#invGo'); if (ig) ig.onclick = async () => { ig.disabled = true; ig.textContent = 'Investigating...'; try { INV[ig.dataset.d] = await api('/api/console/investigate/' + ig.dataset.d); } catch (e) { fail(e); } last = ''; refresh(); };
  const sv = $('#saveRules');
  if (sv) sv.onclick = async () => {
    const values = {}; document.querySelectorAll('[data-rule]').forEach(i => values[i.dataset.rule] = +i.value);
    if (Object.values(values).some(v => !Number.isFinite(v))) return fail('Enter a number in every field.');
    $('#saved').textContent = '';
    try { await api('/api/console/rules?market=' + RM, 'PUT', {values}); $('#saved').textContent = 'Saved. Applies to the next delay.'; last = ''; ov = await api('/api/console/overview?market=' + RM); } catch (e) { fail(e); }
  };
}
// Buttons a role may not use are switched off and say why. The server enforces the same limits.
function applyRole() {
  if (!ME) return;
  const off = (sel, why) => document.querySelectorAll(sel).forEach(e => { e.disabled = true; e.title = why; });
  if (ME.role !== 'admin') off('#saveRules,#asAdd,[data-asdel],[data-accept],[data-rule]', 'Only an admin can change this.');
  if (ME.role === 'agent') off('.act,.eact,.bact,.act-ask', 'Your role can look but not decide. Ask a reviewer.');
}
$('#aiOn').innerHTML = aiChip('AI on');  // replaced with the real state once the overview loads

/* ---------- Sign in ---------- */
let timer = null, GATE = {stage: 'email', email: '', ch: null, code: '', err: '', demos: null};
const ROLE = {admin: 'Admin', reviewer: 'Reviewer', agent: 'Agent'};
async function showGate(msg) {
  clearInterval(timer); timer = null; ME = null; store.set('koda.token', null);
  if (GATE.demos === null) { try { GATE.demos = (await api('/api/auth/demo-accounts')).staff; } catch (e) { GATE.demos = []; } if (GATE.demos.length && !GATE.email) GATE.email = GATE.demos[GATE.demos.length - 1].email; }
  GATE.stage = 'email'; GATE.ch = null; GATE.code = ''; GATE.err = msg || ''; drawGate();
}
function drawGate() {
  const g = $('#gate'); g.hidden = false;
  const demo = GATE.demos || [];
  g.innerHTML = `<div class="gbox">
    <div><span class="wordmark" role="img" aria-label="KODA"><i>K</i><i>O</i><i>D</i><i>A</i></span> <span class="mute" style="font-size:13px;margin-left:6px">Claims desk</span></div>
    ${GATE.stage === 'email' ? `<h1>Sign in to the insurer desk</h1>
      <p>Use your work email. We send a 6 digit code to confirm it is you.</p>
      <label>Work email<input id="gEmail" class="field" type="email" autocomplete="username" value="${esc(GATE.email)}"></label>
      ${demo.length ? `<div><div class="mute" style="font-size:12.5px;margin-bottom:6px">Demo accounts. Pick a role to see what each can do.</div><div class="gdemo">${demo.map(d => `<button data-gdemo="${esc(d.email)}" class="${d.email === GATE.email ? 'on' : ''}"><span><b>${esc(d.name)}</b><br><small class="mute">${esc(d.title)}</small></span><span class="chip ${d.role === 'admin' ? 'paid' : d.role === 'reviewer' ? 'blue' : ''}">${ROLE[d.role] || d.role}</span></button>`).join('')}</div></div>` : ''}
      ${GATE.err ? `<div class="note" role="alert">${esc(GATE.err)}</div>` : ''}
      <button id="gSend" class="btn primary">Send code</button>`
    : `<button class="gback" id="gBack"><span class="ms" aria-hidden="true" style="transform:scaleX(-1)">arrow_forward</span> Back</button>
      <h1>Enter your code</h1>
      <p>We sent a 6 digit code to ${esc(GATE.ch.sent_to)}. It works for 5 minutes.</p>
      ${GATE.ch.demo_code ? `<div class="note info">Demo mode: no message is really sent. Your code is <b class="mono">${esc(GATE.ch.demo_code)}</b>. It is filled in below.</div>` : ''}
      <input id="gCode" class="field gcode mono" inputmode="numeric" maxlength="6" autocomplete="one-time-code" value="${esc(GATE.code)}" aria-label="6 digit code">
      ${GATE.err ? `<div class="note" role="alert">${esc(GATE.err)}</div>` : ''}
      <button id="gGo" class="btn primary">Sign in</button>`}
    <p style="font-size:12.5px">Signing in is recorded in the audit log. Your session ends after 60 minutes without use.</p></div>`;
  const q = x => g.querySelector(x);
  g.querySelectorAll('[data-gdemo]').forEach(b => b.onclick = () => { GATE.email = b.dataset.gdemo; GATE.err = ''; drawGate(); });
  if (q('#gEmail')) { q('#gEmail').oninput = e => GATE.email = e.target.value; q('#gEmail').onkeydown = e => { if (e.key === 'Enter') q('#gSend').click(); }; }
  if (q('#gSend')) q('#gSend').onclick = async () => {
    try { GATE.ch = await api('/api/auth/staff/start', 'POST', {email: GATE.email}); GATE.code = GATE.ch.demo_code || ''; GATE.stage = 'code'; GATE.err = ''; } catch (e) { GATE.err = String(e); }
    drawGate();
  };
  if (q('#gBack')) q('#gBack').onclick = () => { GATE.stage = 'email'; GATE.err = ''; drawGate(); };
  if (q('#gCode')) { q('#gCode').oninput = e => GATE.code = e.target.value; q('#gCode').onkeydown = e => { if (e.key === 'Enter') q('#gGo').click(); }; }
  if (q('#gGo')) q('#gGo').onclick = async () => {
    try { const r = await api('/api/auth/verify', 'POST', {challenge: GATE.ch.challenge, code: GATE.code}); store.set('koda.token', r.token); store.set('koda.staff', r.me.id); GATE.stage = 'email'; start(); }
    catch (e) { GATE.err = String(e); drawGate(); }
  };
}
window.addEventListener('koda:unauth', async e => {
  if (!$('#gate').hidden) return;
  store.set('koda.token', null);
  if (DEMO.demo && await autoSignIn()) return start();
  showGate(String(e.detail || 'Your session ended. Sign in again.'));
});
async function signOutStaff() { try { await api('/api/auth/logout', 'POST'); } catch (e) {} store.set('koda.staff', null); showGate(); }
function start() {
  $('#gate').hidden = true; last = '';
  refresh().catch(() => {});
  clearInterval(timer);
  timer = setInterval(() => { if ($('#gate').hidden && !document.hidden && !['rules', 'profile'].includes(route.split('/')[0]) && !document.activeElement?.matches('textarea,input,select')) refresh().catch(() => {}); }, location.search.includes('embed') ? 2500 : 3000);
}
let DEMO = {demo: false};
async function autoSignIn() {
  // Demo mode signs the officer in, so a judge is never stopped by a code. Code sign-in stays in the app.
  try { DEMO = await api('/api/app/mode'); } catch (e) {}
  if (!DEMO.demo) return false;
  try { const r = await api('/api/auth/demo-session', 'POST', {kind: 'staff', id: DEMO.staff}); store.set('koda.token', r.token); store.set('koda.staff', r.me.id); return true; } catch (e) { return false; }
}
(async () => {
  if (store.get('koda.token')) { try { await api('/api/auth/me'); return start(); } catch (e) {} }
  if (await autoSignIn()) return start();
  showGate();
})();
</script>
