<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#071C3F">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<title>KODA, smart flight cover</title>
<link rel="stylesheet" href="/static/fonts.css">
<link rel="stylesheet" href="/static/ui.css">
<style>
  body{background:#DDE3EB;background-image:radial-gradient(#C9D2DD 1px,transparent 1px);background-size:18px 18px}
  #app{position:relative;display:flex;flex-direction:column;width:100%;max-width:400px;height:100dvh;margin:0 auto;background:var(--paper);overflow:hidden}
  @media(min-width:440px){#app{margin:20px auto;height:820px;max-height:calc(100dvh - 40px);border-radius:34px;box-shadow:0 0 0 9px #071C3F,0 24px 70px rgba(12,27,46,.35)}}
  .embed #app{margin:0;max-width:none;height:100dvh;max-height:none;border-radius:0;box-shadow:none}
  .embed body{background:transparent;background-image:none}

  /* ---- chrome */
  .top{display:flex;align-items:center;gap:10px;padding:14px 16px 12px;background:var(--navy);color:#fff;flex-shrink:0}
  .top .wordmark{font-size:18px}
  .bk{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .bk .ms{transform:scaleX(-1);font-size:19px}
  .bk[hidden]{display:none}
  .ttl{font-family:'Figtree',sans-serif;font-weight:700;font-size:16px;letter-spacing:-.01em}
  .top .push{margin-left:auto;display:flex;align-items:center;gap:7px;min-width:0}
  .ptchip{font-size:11.5px;font-weight:700;background:#0F3470;color:#fff;border-radius:99px;padding:4px 8px;white-space:nowrap;max-width:112px;overflow:hidden;text-overflow:ellipsis}
  .av{width:31px;height:31px;border-radius:50%;background:var(--amber);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0}
  #view{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 15px 20px;display:flex;flex-direction:column;gap:13px;scrollbar-width:none}
  #view::-webkit-scrollbar{display:none}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line2);flex-shrink:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0;font-size:11px;font-weight:600;color:var(--mute);border-radius:12px}
  .tab .ms{font-size:21px;width:48px;height:28px;line-height:28px;text-align:center;border-radius:99px;transition:background .15s,color .15s}
  .tab:hover .ms{background:var(--line2)}
  .tab.on{color:var(--ink)}
  .tab.on .ms{background:var(--cobalt-t);color:var(--cobalt);font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
  .fade{display:flex;flex-direction:column;gap:13px}
  @media(prefers-reduced-motion:no-preference){.fade{animation:fade .22s ease}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}}

  /* ---- who is signed in */
  .who{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px}
  .who .ava{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex-shrink:0}
  .who b{display:block;font-size:15px;letter-spacing:-.01em}
  .who small{display:block;font-size:12px;color:var(--mute);margin-top:1px}
  .who .ms.go{margin-left:auto;color:var(--faint);font-size:18px}

  /* ---- trip row */
  .trip{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;display:grid;gap:9px}
  .trip:hover{border-color:var(--cobalt)}
  .trip .r1{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
  .trip .r1 .mono{color:var(--ink2);font-weight:600}
  .trip .r2{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
  .trip .ap{font-family:'Figtree',sans-serif;font-weight:800;font-size:23px;letter-spacing:-.025em;line-height:1}
  .trip .ap small{display:block;font-size:11px;font-weight:500;color:var(--mute);letter-spacing:0;margin-top:3px}
  .trip .ln{display:grid;justify-items:center;gap:3px;color:var(--faint)}
  .trip .ln hr{width:100%;border:0;border-top:2px dotted var(--line);margin:0}
  .trip .ln .ms{font-size:16px;transform:rotate(90deg);color:var(--cobalt)}
  .trip .r3{display:flex;align-items:center;gap:7px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:9px}
  .st{font-size:11.5px;font-weight:700;border-radius:99px;padding:3px 9px;display:inline-flex;align-items:center;gap:4px}
  .st .ms{font-size:13px}
  .st.ok{background:var(--green-t);color:#0B6B49}
  .st.warn{background:var(--amber-t);color:#6B4300}
  .st.none{background:#EEF1F5;color:var(--mute)}
  .st.info{background:var(--cobalt-t);color:#08409B}
  .st.red{background:var(--red-t);color:#8C2318}
  .grow{margin-left:auto}

  /* ---- two entry doors */
  .door{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}
  .door:hover{border-color:var(--cobalt)}
  .door .ic{width:34px;height:34px;border-radius:9px;background:var(--cobalt-t);color:var(--cobalt);display:grid;place-items:center;flex-shrink:0}
  .door .ic .ms{font-size:19px}
  .door b{display:block;font-size:14.5px}
  .door small{display:block;font-size:12.5px;color:var(--mute);margin-top:2px;line-height:1.4}
  .door>.ms{margin-left:auto;align-self:center;color:var(--faint)}

  /* ---- empty state */
  .empty{display:grid;gap:9px;justify-items:center;text-align:center;padding:30px 18px;background:#fff;border:1px solid var(--line);border-radius:14px}
  .empty .ic{width:46px;height:46px;border-radius:50%;background:var(--line2);color:var(--mute);display:grid;place-items:center}
  .empty .ic .ms{font-size:24px}
  .empty b{font-size:15.5px}
  .empty p{font-size:13px;color:var(--mute);line-height:1.5;max-width:255px}

  /* ---- wallet */
  .bal{background:var(--navy);color:#fff;border-radius:18px;padding:17px 18px;position:relative;overflow:hidden}
  .bal small{color:var(--navy-mute);font-size:12.5px}
  .bal b{display:block;font-family:'Figtree',sans-serif;font-weight:800;font-size:37px;letter-spacing:-.035em;line-height:1.05;margin:3px 0 2px;font-variant-numeric:tabular-nums}
  .bal .two{display:flex;gap:14px;margin-top:9px;padding-top:9px;border-top:1px solid var(--navy-line);font-size:12.5px;color:var(--navy-mute)}
  .bal .two b{display:inline;font-size:13.5px;font-weight:700;color:#fff;letter-spacing:0;margin:0}
  .out{display:flex;gap:11px;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px}
  .out:hover{border-color:var(--cobalt)}
  .out b{display:block;font-size:14px}
  .out small{display:block;font-size:12px;color:var(--mute);margin-top:2px}
  .out .px{margin-left:auto;text-align:right;flex-shrink:0}
  .out .px b{font-family:'Geist Mono',monospace;font-size:13px;color:var(--cobalt)}
  .out .px small{font-size:11px}
  .out[disabled]{opacity:.5}
  .qrwrap{display:grid;gap:11px;justify-items:center;text-align:center;background:#fff;border:2px dashed var(--cobalt);border-radius:16px;padding:17px}
  .qrwrap img{width:172px;height:172px;display:block}
  .qrwrap .code{font-family:'Geist Mono',monospace;font-weight:700;font-size:21px;letter-spacing:.07em;color:var(--navy)}
  .vrow{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line2);font-size:13.5px}
  .vrow:first-of-type{border-top:0}
  .vrow .grow{margin-left:auto;text-align:right}

  /* ---- misc */
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}
  .cap{font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:8px;text-transform:none}
  .kv{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:5px 0}
  .kv span:first-child{color:var(--mute)}
  .kv b{font-weight:600}
  .field{height:45px;border-radius:10px;font-size:15px}
  .field.mono{font-family:'Geist Mono',monospace}
  .btn{height:47px;border-radius:10px;font-size:15px}
  .btn.sm{height:36px;font-size:13px;padding:0 13px}
  .row2{display:flex;gap:8px}
  .frm{display:grid;gap:9px}
  .frm label{font-size:12.5px;font-weight:600;display:grid;gap:4px}
  .swrow{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.45}
  .swrow input{margin-top:2px;width:18px;height:18px;accent-color:var(--cobalt);flex-shrink:0}
  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .chips::-webkit-scrollbar{display:none}
  .chips button{flex-shrink:0;height:31px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600}
  .chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .fcbar{height:7px;border-radius:99px;background:var(--line2);overflow:hidden;margin:7px 0}
  .fcbar i{display:block;height:100%;border-radius:99px;background:var(--cobalt)}
  .fc.high .fcbar i{background:#E08A00}.fc.medium .fcbar i{background:#0DC5FB}
  .note{font-size:13px;line-height:1.5}
  .alertbox{display:flex;gap:10px;align-items:flex-start;background:var(--amber-t);border:1px solid #F3D68E;color:#5C3A00;border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.45}
  .alertbox .ms{font-size:20px;color:#B26A00;flex-shrink:0}
  .rcpt{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;display:grid;gap:3px}
  .rcpt .amt{font-family:'Figtree',sans-serif;font-weight:800;font-size:36px;letter-spacing:-.03em;color:var(--green);line-height:1.1}
  .step{display:flex;gap:11px;position:relative;padding-bottom:14px}
  .step:last-child{padding-bottom:0}
  .step::before{content:'';position:absolute;left:10px;top:23px;bottom:0;border-left:2px solid var(--line)}
  .step:last-child::before{display:none}
  .dot{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;border:2px solid var(--green);color:#fff;background:var(--green)}
  .dot .ms{font-size:13px}
  .dot.wait{border-color:var(--amber);color:#B26A00;background:var(--amber-t)}
  .step b{font-size:13.5px}
  .step small{display:block;font-size:12.5px;color:var(--mute)}
  .mrow{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line2);font-size:13.5px}
  .mrow:first-of-type{border-top:0}
  .tx{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line2);font-size:13px}
  .tx:first-of-type{border-top:0}
  .tx b{margin-left:auto;font-family:'Geist Mono',monospace}
  .tx .plus{color:var(--green)}
  .fl{display:grid;gap:9px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px}
  .fl:hover{border-color:var(--cobalt)}
  .fl .t{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute)}
  .fl .m{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
  .fl .m b{font-size:19px;font-weight:700;letter-spacing:-.015em}
  .fl .m small{display:block;font-size:11.5px;color:var(--mute)}
  .fl .b{display:flex;justify-content:space-between;align-items:center;font-size:12px;border-top:1px dashed var(--line);padding-top:9px}
  .rk{font-weight:600;border-radius:99px;padding:3px 9px;font-size:11.5px}
  .rk.low{background:#E5F6EC;color:#12663A}.rk.medium{background:#FFF1D6;color:#7A4B00}.rk.high{background:#FDE4E1;color:#9A2A1D}
  .seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line2);border-radius:11px;padding:3px;gap:3px}
  .seg button{height:36px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--mute)}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(7,28,63,.14)}
  .cov{display:grid;gap:8px}
  .tier{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px}
  .tier.on{border-color:var(--cobalt);background:#F6F8FE}
  .tier .t{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-size:15px}
  .tier .d{font-size:12.5px;color:var(--ink2);margin-top:5px;line-height:1.45}
  .tier .px{font-family:'Geist Mono',monospace;font-size:13.5px;color:var(--cobalt)}
  .tick{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;color:#fff;flex-shrink:0}
  .tier.on .tick{background:var(--cobalt);border-color:var(--cobalt)}
  .tick .ms{font-size:15px}
  .mlist{display:grid;gap:2px}
  .mi{display:flex;gap:11px;align-items:center;width:100%;text-align:left;padding:12px 2px;border-top:1px solid var(--line2);font-size:14.5px;font-weight:600}
  .mi:first-child{border-top:0}
  .mi .ms{font-size:20px;color:var(--cobalt)}
  .mi small{display:block;font-size:12px;color:var(--mute);font-weight:400;margin-top:1px}
  .mi .ms.go{margin-left:auto;color:var(--faint);font-size:18px}
  .dim{font-size:12px;color:var(--mute);line-height:1.5}
  #sheet{position:absolute;inset:0;background:rgba(12,27,46,.45);z-index:50;display:flex;align-items:flex-end}
  #sheet .in{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:16px;display:grid;gap:11px;max-height:88%;overflow-y:auto}
  #sheet h2{font-size:17px}
  #toast{position:absolute;left:14px;right:14px;bottom:82px;transform:none;max-width:none;z-index:60}
  .pushbn{position:absolute;z-index:70;left:10px;right:10px;top:62px;display:flex;gap:10px;align-items:flex-start;background:rgba(10,20,36,.96);color:#fff;border-radius:15px;padding:11px 13px;font-size:12.5px;line-height:1.4;box-shadow:0 10px 30px rgba(7,28,63,.35);transform:translateY(-230%);transition:transform .45s cubic-bezier(.2,.8,.2,1);text-align:left;width:calc(100% - 20px)}
  .pushbn.in{transform:none}
  .pushbn b{display:block;font-size:11.5px;color:#FFC93C;margin-bottom:1px}
  .pushbn .ms{font-size:19px;color:#FFC93C;flex-shrink:0}
  [hidden]{display:none!important}
  /* chat */
  .thread{display:flex;flex-direction:column;gap:9px}
  .bub{max-width:84%;padding:10px 12px;border-radius:14px;font-size:13.5px;line-height:1.45;position:relative}
  .bub .by{display:block;font-size:11px;font-weight:700;margin-bottom:3px;letter-spacing:.01em}
  .bub.them{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:5px}
  .bub.them .by{color:var(--cobalt)}
  .bub.human{background:#F3F8FF;border-color:#CBDCFB}
  .bub.human .by{color:#0A2E6E}
  .bub.me{background:var(--navy);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
  .bub.sys{align-self:center;background:var(--amber-t);border:1px solid #F3D68E;color:#5C3A00;font-size:12.5px;text-align:center;max-width:94%}
  .bub time{display:block;font-size:10.5px;opacity:.6;margin-top:4px}
  .whochip{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:12.5px;position:sticky;top:-14px;z-index:5;box-shadow:0 6px 12px rgba(7,28,63,.06)}
  .whochip .dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0}
  .whochip .dot.wait{background:var(--amber)}
  .whochip b{font-size:13px}
  .composer{display:flex;gap:8px;align-items:flex-end}
  .composer textarea{flex:1;height:46px;max-height:110px;padding:12px;border-radius:12px;font-size:14px;resize:none}
  .composer button{width:46px;height:46px;border-radius:12px;flex-shrink:0;display:grid;place-items:center}
  .composer button .ms{transform:rotate(-90deg)}
  /* cover ladder */
  .ladder{display:grid;gap:7px}
  .lrow{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;font-size:13px}
  .lrow .bar{height:10px;border-radius:99px;background:var(--line2);overflow:hidden}
  .lrow .bar i{display:block;height:100%;border-radius:99px;background:var(--cobalt)}
  .lrow.cx .bar{background:none;border:2px dashed var(--line);height:12px;border-radius:99px}
  .lrow.cx.on .bar{border-color:var(--green)}
  .lrow.on .bar i{background:var(--green)}
  .lrow .amt{font-family:'Geist Mono',monospace;font-weight:600;font-size:12.5px}
  .lnow{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:#6B4300;background:var(--amber-t);border:1px solid #F3D68E;border-radius:10px;padding:7px 10px}
  .yes,.no{display:flex;gap:9px;align-items:flex-start;font-size:13px;padding:7px 0;border-top:1px solid var(--line2)}
  .yes:first-of-type,.no:first-of-type{border-top:0}
  .yes .ms{color:var(--green);font-size:18px;flex-shrink:0}
  .no .ms{color:var(--faint);font-size:18px;flex-shrink:0}
  .yes b,.no b{display:block;font-size:13.5px}
  .yes small,.no small{color:var(--mute);font-size:12.5px;line-height:1.4}
  .plain{background:none;border:0;padding:0;color:var(--ink2);font-size:13px;line-height:1.5}
  .msgbox{background:var(--cobalt-t);border:1px solid #CBDCFB;color:#0A2E6E;border-radius:11px;padding:11px 13px;font-size:13px;line-height:1.5}
  .msgbox.good{background:var(--green-t);border-color:#A9DCC4;color:#0B5138}
  h1{font-size:23px;letter-spacing:-.02em}
  /* ---- friendlier surfaces: one radius, lighter borders, a hint of depth */
  #app{background:#F4F7FB}
  .card,.trip,.door,.empty,.rcpt,.fl,.who{border-color:var(--line2);border-radius:16px;box-shadow:0 1px 2px rgba(7,28,63,.04)}
  .cap{font-size:12px;letter-spacing:.01em;color:var(--mute);font-weight:700}
  .sh{font-size:13px;font-weight:700;color:var(--ink2);margin:2px 2px 8px}
  .stack{display:grid;gap:9px}
  .hint{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font-size:13px;background:var(--cobalt-t);color:#08409B;border:1px dashed #9DBDF5;border-radius:12px;padding:9px 12px}
  .hint .ms{font-size:17px}
  .nocover{display:grid;gap:8px}
  .pays{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
  .pays span{background:#F4F7FB;border-radius:12px;padding:10px;display:grid;gap:2px}
  .pays b{font-size:17px;font-weight:800;letter-spacing:-.02em;color:var(--navy)}
  .pays small{font-size:11.5px;color:var(--mute);line-height:1.3}
  .claimref{font-size:12px;color:var(--mute);margin-top:6px}
  .sim{font-size:12px;color:#6B4300;background:var(--amber-t);border-radius:8px;padding:6px 9px;margin-top:6px;justify-self:start}
  .rcpt .st{justify-self:start}
  .tl{display:grid;gap:0}
  .tl .ev{display:grid;grid-template-columns:14px 1fr;gap:10px;position:relative;padding-bottom:12px}
  .tl .ev:last-child{padding-bottom:0}
  .tl .ev::before{content:'';position:absolute;left:6px;top:14px;bottom:0;border-left:2px solid var(--line2)}
  .tl .ev:last-child::before{display:none}
  .tl .ev i{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--cobalt);margin-top:3px}
  .tl .ev:last-child i{background:var(--cobalt)}
  .tl .ev b{display:block;font-size:13.5px;font-weight:600;line-height:1.35}
  .tl .ev small{display:block;font-size:12px;color:var(--mute);margin-top:1px}
  details.faq{border-top:1px solid var(--line2);padding:11px 0}
  details.faq:first-of-type{border-top:0}
  details.faq summary{list-style:none;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;cursor:pointer}
  details.faq summary::-webkit-details-marker{display:none}
  details.faq summary .ms{margin-left:auto;color:var(--faint);transition:transform .15s}
  details.faq[open] summary .ms{transform:rotate(180deg)}
  /* greeting */
  .hello{padding:2px 2px 0}
  .hello h1{font-size:25px;letter-spacing:-.025em}
  .hello p{font-size:13.5px;color:var(--mute);margin-top:3px}
  /* next flight, as a boarding pass */
  .pass{display:grid;gap:13px;width:100%;text-align:left;background:var(--navy);color:#fff;border-radius:20px;padding:16px 17px 15px;position:relative;box-shadow:0 10px 24px rgba(7,28,63,.18)}
  .pass:focus-visible{outline-offset:3px}
  .pass .p1{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--navy-mute)}
  .pass .p1 .mono{color:#fff;font-weight:600}
  .pass .p2{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
  .pass .ap{font-weight:800;font-size:32px;letter-spacing:-.03em;line-height:1}
  .pass .ap small{display:block;font-size:12px;font-weight:500;color:var(--navy-mute);letter-spacing:0;margin-top:5px}
  .pass .ap.r{text-align:right}
  .pass .ln{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;color:#5CCFF8}
  .pass .ln hr{border:0;border-top:2px dotted var(--navy-line);margin:0}
  .pass .ln .ms{font-size:18px;transform:rotate(90deg)}
  .pass .p3{display:grid;grid-template-columns:repeat(3,auto);justify-content:space-between;gap:10px;border-top:1px dashed var(--navy-line);padding-top:12px}
  .pass .p3 small{display:block;font-size:11px;color:var(--navy-mute);margin-bottom:2px}
  .pass .p3 b{font-size:13.5px;font-weight:700}
  .pass .p4{display:inline-flex;align-items:center;gap:6px;justify-self:start;font-size:12.5px;font-weight:700;background:#FFF2D3;color:#6B4300;border-radius:99px;padding:4px 10px}
  .pass .p4 .ms{font-size:15px}
  .pass .st.none{background:rgba(255,255,255,.12);color:#fff}
  /* rows you can act on */
  .list{display:grid;background:#fff;border:1px solid var(--line2);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(7,28,63,.04)}
  .todo{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 13px;background:#fff;border-top:1px solid var(--line2)}
  .todo:first-child{border-top:0}
  .todo:hover{background:#F8FAFD}
  .todo.big{border:1px solid var(--line2);border-radius:16px;padding:14px}
  .todo .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;background:var(--line2);color:var(--mute)}
  .todo .ic .ms{font-size:19px}
  .todo .ic.ok{background:var(--green-t);color:var(--green)}.todo .ic.warn{background:var(--amber-t);color:#B26A00}
  .todo .ic.info{background:var(--cobalt-t);color:var(--cobalt)}.todo .ic.red{background:var(--red-t);color:var(--red)}
  .todo b{display:block;font-size:14px;font-weight:600;line-height:1.3}
  .todo b .mono{font-weight:600}
  .todo small{display:block;font-size:12.5px;color:var(--mute);margin-top:2px;line-height:1.35}
  .todo>.ms.go{margin-left:auto;color:var(--faint);font-size:18px}
  .todo>span:nth-child(2){min-width:0}
  .todo .grow{flex-shrink:0;padding-left:6px}
  .todo .st{white-space:nowrap}
  /* quick actions */
  .qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .qa button{display:grid;justify-items:center;gap:7px;padding:13px 6px 12px;background:#fff;border:1px solid var(--line2);border-radius:16px;font-size:12.5px;font-weight:600;color:var(--ink);box-shadow:0 1px 2px rgba(7,28,63,.04)}
  .qa button:hover{border-color:var(--cobalt)}
  .qa .ic{width:38px;height:38px;border-radius:12px;background:var(--cobalt-t);color:var(--cobalt);display:grid;place-items:center}
  .qa .ic .ms{font-size:20px}
  .seg button:focus-visible,.qa button:focus-visible,.todo:focus-visible{outline:2px solid var(--cobalt);outline-offset:-2px}

  .sub{font-size:13px;color:var(--mute);margin-top:5px;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button id="back" class="bk" hidden aria-label="Back"><span class="ms" aria-hidden="true">arrow_forward</span></button>
    <span id="brand" class="wordmark" role="img" aria-label="KODA"><i>K</i><i>O</i><i>D</i><i>A</i></span>
    <span id="ttl" class="ttl" hidden></span>
    <span class="push">
      <button id="ptsChip" class="ptchip" hidden aria-label="Open your wallet"></button>
      <button id="avatar" class="av" aria-label="Open the menu">G</button>
    </span>
  </header>
  <div id="view"></div>
  <nav class="tabs" aria-label="Sections">
    <button data-tab="home" class="tab on"><span class="ms" aria-hidden="true">dashboard</span><span>Home</span></button>
    <button data-tab="cover" class="tab"><span class="ms" aria-hidden="true">verified_user</span><span>Cover</span></button>
    <button data-tab="claims" class="tab"><span class="ms" aria-hidden="true">receipt_long</span><span>Claims</span></button>
    <button data-tab="wallet" class="tab"><span class="ms" aria-hidden="true">payments</span><span>Wallet</span></button>
    <button data-tab="help" class="tab"><span class="ms" aria-hidden="true">support_agent</span><span>Help</span></button>
  </nav>
  <div id="push" class="pushbn" hidden></div>
</div>
<div id="toast" class="hidden"></div>
<script src="/static/ui.js"></script>
<script>
/* KODA traveler app.
   Five tabs: Home (where things stand), Cover (your flights, check a booking, book with cover), Claims, Wallet, Help.
   Screens are pushed on a stack so the back button always goes one step back. */
const TAB_TITLES = {home: '', cover: 'Cover', claims: 'Claims', wallet: 'Wallet', help: 'Help'};
let H = null;            // /api/app/home payload
let CS = null;           // /api/customer/{id} payload (methods, vouchers, ledger)
let SV = null;           // outlets at the airport
let CH = null;           // the support chat
let poll = null;         // while the chat is open, a reply from a person shows up by itself
let tab = 'home';
let stack = [];          // [{name, ...params}]
let MODE = {demo: true};
let form = {};           // scratch state for whichever screen is open

const cur = () => (H && H.currency) || 'SGD';
const sgd = n => 'S$' + Number(n).toLocaleString('en-US', {minimumFractionDigits: Number.isInteger(+n) ? 0 : 2, maximumFractionDigits: 2});
const pts = n => Number(n).toLocaleString('en-US') + ' pts';
const cur_screen = () => stack[stack.length - 1] || null;
const go = s => { stack.push(s); form = {}; render(); };
const back = () => {
  const s = cur_screen();
  if (s && s.name === 'buy' && form.step === 'confirm') { form.step = 'results'; return render(); }
  if (s && s.name === 'buy' && form.step === 'results') { form.step = null; form.results = null; return render(); }
  if (s && s.name === 'check' && form.res) { form.res = null; return render(); }
  stack.pop(); form = {}; render();
};
const root = () => { stack = []; form = {}; render(); };
const initials = n => (n || '?').split(' ').filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
const dayLabel = ts => new Date(ts * 1000).toLocaleDateString('en-GB', {day: 'numeric', month: 'short'});

/* ---------------------------------------------------------------- data */
async function boot() {
  try { MODE = await api('/api/app/mode'); } catch (e) {}
  if (MODE.demo && !store.get('calmy.token')) {
    // Demo mode signs the traveler in, so a judge never sees a sign-in screen. Code sign-in is still in the app.
    try { const r = await api('/api/auth/demo-session', 'POST', {kind: 'traveler', id: MODE.traveler}); store.set('calmy.token', r.token); } catch (e) {}
  }
  await loadHome();
}
async function loadHome() {
  try { H = await api('/api/app/home'); } catch (e) { return fail(e); }
  HIST = {};
  $('#avatar').textContent = initials(H.customer.name);
  render();
}
/* Keep claims in step with the insurer: a decision made on the claims desk shows up here without a reload.
   Only screens that read the home summary are refreshed, and never while the traveler is typing or filling a form. */
const LIVE_SCREENS = ['trip', 'claim'];
const claimSig = h => JSON.stringify((h.claims || []).map(g => [g.policy, g.state, g.decision && [g.decision.status, g.decision.amount, g.decision.message], g.bag && g.bag.decision]));
async function syncClaims() {
  const s = cur_screen();
  if (!H || document.hidden || (s && !LIVE_SCREENS.includes(s.name)) || (!s && ['wallet', 'cover'].includes(tab))) return;
  if (document.activeElement && document.activeElement.matches('input,textarea,select')) return;
  let fresh;
  try { fresh = await api('/api/app/home'); } catch (e) { return; }  // a missed poll is retried on the next tick
  if (claimSig(fresh) === claimSig(H) && fresh.balance.points === H.balance.points) return;
  const before = Object.fromEntries((H.claims || []).map(g => [g.policy, g.state]));
  H = fresh; CS = null; HIST = {}; render();
  const moved = (H.claims || []).find(g => before[g.policy] && before[g.policy] !== g.state && ['paid', 'declined'].includes(g.state));
  if (moved) pushNote(moved.state === 'paid' ? 'Your claim was approved' : 'Your claim was decided',
    `${moved.flight.code}: ${moved.decision && moved.decision.message ? moved.decision.message : 'Open Claims to see the decision.'}`);
}
setInterval(syncClaims, 4000);
async function loadWallet(force) {
  if (CS && !force) return;
  try { CS = await api(`/api/customer/${H.customer.id}`); } catch (e) { fail(e); }
}
async function loadChat() {
  try { CH = await api('/api/app/chat'); } catch (e) { fail(e); }
}
async function loadCover(policy) {
  try { form.cover = await api(`/api/app/cover/${policy}`); } catch (e) { fail(e); }
}
async function loadOutlets(airport, force) {
  if (SV && SV.airport === airport && !force) return;
  try { SV = await api(`/api/customer/${H.customer.id}/services?airport=${airport}`); } catch (e) { fail(e); }
}
const homeAirport = () => {
  const next = H.trips.find(t => t.upcoming);
  return (next && next.legs.find(g => !g.departed).flight.origin) || 'SIN';
};

/* ---------------------------------------------------------------- render */
function render() {
  const s = cur_screen();
  const title = s ? SCREENS[s.name].title(s) : TAB_TITLES[tab];
  $('#back').hidden = !s;
  $('#brand').hidden = !!title;
  $('#ttl').hidden = !title;
  $('#ttl').textContent = title || '';
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const chip = $('#ptsChip');
  if (H) { chip.hidden = false; chip.textContent = Number(H.balance.points).toLocaleString('en-US') + ' pts'; }
  const html = !H ? '<p class="dim">Loading your trips…</p>' : s ? SCREENS[s.name].body(s) : TABS[tab]();
  $('#view').innerHTML = `<div class="fade">${html}</div>`;
  const onChat = s && s.name === 'chat';
  $('#view').scrollTop = onChat ? $('#view').scrollHeight : 0;
  clearInterval(poll); poll = null;
  if (onChat) poll = setInterval(async () => {
    if (document.hidden || document.activeElement === $('#chText')) return;
    const was = CH && CH.messages.length, mode = CH && CH.mode;
    await loadChat();
    if (CH && (CH.messages.length !== was || CH.mode !== mode)) render();
  }, 4000);
}
function setTab(t) {
  tab = t; stack = []; form = {};
  if (t === 'wallet') loadWallet().then(() => loadOutlets(homeAirport())).then(render);
  render();
}

/* ---------------------------------------------------------------- shared pieces */
const STATE_CHIP = {
  covered: ['ok', 'verified_user', 'Covered'],
  no_cover: ['none', 'shield', 'No cover'],
  paid: ['ok', 'paid', 'Paid'],
  review: ['warn', 'hourglass_top', 'With a person'],
  declined: ['red', 'error', 'Not paid'],
  not_covered: ['none', 'rule', 'Below the rule'],
  completed: ['none', 'check', 'Trip finished'],
  ended: ['none', 'check', 'Trip finished'],
};
function chip(state) {
  const [k, i, t] = STATE_CHIP[state] || STATE_CHIP.completed;
  return `<span class="st ${k}">${ico(i)}${t}</span>`;
}
function coverWord(g) {
  return {both: 'Delay and baggage', delay: 'Delay only', baggage: 'Baggage only', none: 'No cover'}[g.cover];
}
function tripRow(t) {
  const g = t.legs.find(x => !x.departed) || t.legs[t.legs.length - 1];
  const f = g.flight;
  const late = f.delay_minutes > 0 ? `<span class="st warn">${ico('schedule')}${hm(f.delay_minutes)} late</span>` : '';
  return `<button class="trip" data-trip="${esc(t.ref)}">
    <span class="r1"><span class="mono">${esc(f.code)}</span><span>${esc(f.airline)}</span><span class="grow">${esc(t.trip)} · <span class="mono">${esc(t.ref)}</span></span></span>
    <span class="r2">
      <span class="ap">${esc(f.origin)}<small>${esc(f.origin_city || '')}</small></span>
      <span class="ln"><hr>${ico('flight')}<hr></span>
      <span class="ap" style="text-align:right">${esc(f.dest)}<small>${esc(f.dest_city || '')}</small></span>
    </span>
    <span class="r1">${ico('schedule')}${esc(f.depart_label)}${t.legs.length > 1 ? ' · ' + t.legs.length + ' flights' : ''}</span>
    <span class="r3">${chip(g.state)}${late}<span class="grow dim">${esc(coverWord(g))}</span></span></button>`;
}

/* ---------------------------------------------------------------- tab: home */
const TABS = {};
TABS.home = () => {
  const up = H.trips.filter(t => t.upcoming), past = H.trips.filter(t => !t.upcoming);
  const nextTrip = up[0], next = nextTrip && nextTrip.legs.find(g => !g.departed);
  const open = up.flatMap(t => t.legs.filter(g => !g.departed));
  const bare = open.filter(g => g.state === 'no_cover').length;
  const first = (H.customer.name || '').split(' ')[0];
  const line = !open.length ? 'No flights coming up. Add a booking to get covered.'
    : `${open.length} ${open.length === 1 ? 'flight' : 'flights'} coming up` + (bare ? `, ${bare} without cover.` : ', all covered.');
  const todo = attention();
  return `<section class="hello"><h1>Hi ${esc(first)}</h1><p>${line}</p></section>
  ${next ? passCard(nextTrip, next) : `<div class="empty"><span class="ic">${ico('flight_takeoff')}</span><b>Nothing booked yet</b>
      <p>Check a booking you already have, or book a flight with cover.</p></div>`}
  ${todo.length ? `<section><div class="sh">Needs you</div><div class="list">${todo.join('')}</div></section>` : ''}
  <section class="qa">
    <button data-go="check"><span class="ic">${ico('search')}</span>Add a booking</button>
    <button data-go="buy"><span class="ic">${ico('flight_takeoff')}</span>Book with cover</button>
    <button data-go="chat"><span class="ic">${ico('support_agent')}</span>Ask us</button>
  </section>
  ${up.length > 1 ? `<section><div class="sh">Also coming up</div><div class="list">${up.slice(1).map(tripLine).join('')}</div></section>` : ''}
  ${past.length ? `<section><div class="sh">Past trips</div><div class="list">${past.map(tripLine).join('')}</div></section>` : ''}`;
};
function tripLine(t) {
  const g = t.legs.find(x => !x.departed) || t.legs[t.legs.length - 1], f = g.flight;
  const last = t.legs[t.legs.length - 1].flight, back = t.legs.length > 1 && last.dest === f.origin;
  return `<button class="todo" data-trip="${esc(t.ref)}"><span class="ic ${{paid: 'ok', covered: 'ok', review: 'warn', declined: 'red'}[g.state] || 'none'}">${ico(t.upcoming ? 'flight_takeoff' : 'flight')}</span>
    <span><b>${esc(f.origin)} to ${esc(back ? f.dest + ' and back' : f.dest)}</b><small><span class="mono">${esc(f.code)}</span> · ${esc(f.depart_label)}</small></span>
    <span class="grow">${chip(g.state)}</span></button>`;
}
/* The next flight as a boarding pass: where, when, what cover, and how likely a delay is, in one place. */
function passCard(t, g) {
  const f = g.flight, r = g.risk;
  const late = f.cancelled ? 'Cancelled' : f.delay_minutes > 0 ? hm(f.delay_minutes) + ' late' : '';
  return `<button class="pass" data-trip="${esc(t.ref)}" aria-label="Open trip ${esc(t.ref)}">
    <span class="p1"><span class="mono">${esc(f.code)}</span><span>${esc(f.airline || '')}</span><span class="grow">${chip(g.state)}</span></span>
    <span class="p2"><span class="ap">${esc(f.origin)}<small>${esc(f.origin_city || '')}</small></span>
      <span class="ln"><hr>${ico('flight')}<hr></span>
      <span class="ap r">${esc(f.dest)}<small>${esc(f.dest_city || '')}</small></span></span>
    <span class="p3"><span><small>Departs</small><b>${esc(f.depart_label)}</b></span>
      <span><small>Cover</small><b>${esc({both: 'Delay + bag', delay: 'Delay', baggage: 'Bag only', none: 'None'}[g.cover])}</b></span>
      ${r ? `<span><small>Delay chance</small><b>${r.probability}%</b></span>` : ''}</span>
    ${late ? `<span class="p4">${ico('schedule')}${esc(late)}</span>` : ''}
  </button>`;
}
/* Only things the traveler can act on: a question from KODA, a claim to re-check, a flight with no cover. */
function attention() {
  const out = [], row = (attrs, tone, icon, title, sub) =>
    `<button class="todo" ${attrs}><span class="ic ${tone}">${ico(icon)}</span><span><b>${esc(title)}</b><small>${esc(sub)}</small></span>${ico('arrow_forward', 'go')}</button>`;
  for (const g of H.claims) {
    const d = g.decision, code = g.flight.code;
    if (g.state === 'review' && d && /asked you/.test(d.message || '')) out.push(row('data-go="chat"', 'warn', 'support_agent', `We asked you a question about ${code}`, 'Reply in Messages so we can finish your claim'));
    else if (g.state === 'review') out.push(row(`data-claim="${esc(g.policy)}"`, 'info', 'hourglass_top', `${code} is with a claims officer`, 'Nothing to do. We will message you'));
    else if (g.state === 'declined' && g.can.includes('review')) out.push(row(`data-claim="${esc(g.policy)}"`, 'red', 'error', `${code} was not paid`, 'You can ask for a second review'));
    else if (g.state === 'not_covered' && g.can.includes('recheck')) out.push(row(`data-claim="${esc(g.policy)}"`, 'info', 'rule', `${code} was ${hm(g.flight.delay_minutes || 0)} late`, 'Under the rule. Ask us to check again'));
  }
  for (const t of H.trips) for (const g of t.legs) {
    if (g.departed) continue;
    if (g.state === 'no_cover') out.push(row(`data-buymine="${esc(g.flight.code)}"`, 'none', 'shield', `No cover on ${g.flight.code}`, `Add delay cover from ${sgd(H.rule.delay_premium)}`));
    else if (g.can.includes('add')) out.push(row(`data-addmine="${esc(g.policy)}|${esc(g.flight.code)}|${esc((g.missing || []).join(','))}"`, 'none', 'add', `Add ${(g.missing || []).join(' and ')} cover to ${g.flight.code}`, 'Before the flight leaves'));
  }
  return out;
}

/* ---------------------------------------------------------------- tab: cover */
TABS.cover = () => {
  const legs = H.trips.filter(t => t.upcoming).flatMap(t => t.legs.filter(g => !g.departed).map(g => ({...g, ref: t.ref})));
  const covered = legs.filter(g => g.cover !== 'none'), bare = legs.filter(g => g.cover === 'none');
  const R = H.rule;
  const ways = `<section><div class="sh">Get covered</div><div class="list">
      <button class="todo" data-go="check"><span class="ic info">${ico('search')}</span><span><b>Add a booking</b><small>Bought a ticket on an airline site, Agoda or Trip.com? Bring it in with the booking reference.</small></span>${ico('arrow_forward', 'go')}</button>
      <button class="todo" data-go="buy"><span class="ic info">${ico('flight_takeoff')}</span><span><b>Book a flight with cover</b><small>No ticket yet? Book here and the cover starts with it.</small></span>${ico('arrow_forward', 'go')}</button>
    </div></section>`;
  const pays = `<div class="pays">
      <span><b>${sgd(R.delay_tier1_payout)}</b><small>${Math.round(R.delay_tier1_minutes / 60)}h late</small></span>
      <span><b>${sgd(R.delay_tier2_payout)}</b><small>${Math.round(R.delay_tier2_minutes / 60)}h late or cancelled</small></span>
      <span><b>Bag</b><small>lost bag cover</small></span></div>`;
  return `${covered.length ? `<section><div class="sh">Covered flights</div><div class="list">${covered.map(coverRow).join('')}</div></section>`
      : `<section class="card nocover"><div class="cap">You have no cover on an upcoming flight</div>
          <p class="plain">Cover pays by itself when a flight is late or cancelled. No forms.</p>${pays}
          <p class="dim" style="margin-top:8px">From ${sgd(R.delay_premium)} a flight. Add a booking you already have, or book one here.</p></section>`}
    ${bare.length ? `<section><div class="sh">Booked, not covered yet</div><div class="list">${bare.map(coverRow).join('')}</div></section>` : ''}
    ${ways}`;
};
function coverRow(g) {
  const f = g.flight, has = g.cover !== 'none';
  const attrs = has ? `data-cover="${esc(g.policy)}"` : `data-buymine="${esc(f.code)}"`;
  return `<button class="todo" ${attrs}><span class="ic ${has ? 'ok' : 'none'}">${ico(has ? 'verified_user' : 'shield')}</span>
    <span><b><span class="mono">${esc(f.code)}</span> ${esc(f.origin)} to ${esc(f.dest)}</b><small>${esc(f.depart_label)} · ${has ? esc(coverWord(g)) : 'Tap to add cover from ' + sgd(H.rule.delay_premium)}</small></span>${ico('arrow_forward', 'go')}</button>`;
}
function riskStrip(g) {
  const r = g.risk, lvl = {low: 'Low', medium: 'Medium', high: 'High'}[r.level] || r.level;
  return `<section class="card fc ${r.level}">
    <div class="cap" style="display:flex;align-items:center;gap:6px"><span class="mono">${esc(g.flight.code)}</span><span>${esc(g.flight.origin)} to ${esc(g.flight.dest)}</span>
      <span class="st ${r.level === 'high' ? 'warn' : 'info'}" style="margin-left:auto">${lvl} risk</span></div>
    <div class="fcbar"><i style="width:${r.probability}%"></i></div>
    <p class="plain mute">${r.probability}% chance of a delay over 30 minutes. ${r.band === 'closed' ? 'Delay cover is closed on this flight because a delay is already likely.' : 'Our model reads the schedule, the route, the weather and airspace alerts.'}</p>
  </section>`;
}

/* ---------------------------------------------------------------- tab: claims */
TABS.claims = () => {
  if (!H.claims.length) {
    return `<div class="empty"><span class="ic">${ico('receipt_long')}</span><b>No claims yet</b>

/* The case history: the same record the claims desk reads, so both sides agree on what happened and when. */
let HIST = {};
const claimBody = SCREENS.claim.body;
SCREENS.claim.body = s => claimBody(s) + historyBlock(s.policy);
function historyBlock(policy) {
  if (!policy) return '';
  const h = HIST[policy];
  if (h === undefined) {
    HIST[policy] = null;
    api(`/api/app/history/${encodeURIComponent(policy)}`).then(r => { HIST[policy] = r.history; const s = cur_screen(); if (s && s.name === 'claim' && s.policy === policy) render(); })
      .catch(() => { HIST[policy] = []; });
  }
  if (!h || !h.length) return '';
  const when = ts => new Date(ts * 1000).toLocaleString('en-GB', {day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'});
  return `<section class="card"><div class="cap">What happened</div>
    <div class="tl">${h.map(x => `<div class="ev"><i></i><span><b>${esc(x.what)}</b><small>${esc(when(x.ts))}</small></span></div>`).join('')}</div>
    <p class="dim" style="margin-top:10px">Our claims team sees this same record.</p></section>`;
}
function bagBlock(g) {
  if (g.bag) {

          <div class="lrow"><span>On time</span><span class="bar"><i style="width:2%"></i></span><span class="amt">${sgd(0)}</span></div>
          ${rung(t1, r.delay_tier1_payout, Math.round(t1 / 60) + ' hours late')}
          ${rung(t2, r.delay_tier2_payout, Math.round(t2 / 60) + ' hours late')}
          <div class="lrow cx ${cancelled ? 'on' : ''}"><span>Cancelled</span><span class="bar"></span><span class="amt">${sgd(r.cancel_payout)}</span></div>
        </div>
        ${late || cancelled ? `<div class="lnow" style="margin-top:10px">${ico('bolt')}${cancelled ? 'This flight was cancelled' : 'This flight is ' + hm(late) + ' late'}${v.claim ? ' · ' + (v.claim.status === 'paid' ? 'paid ' + (v.claim.points ? pts(v.claim.points) : sgd(v.claim.amount)) : v.claim.status === 'held' ? 'with a claims officer' : 'not paid') : late >= t1 ? '' : ' · under the rule, so no payout'}</div>` : ''}

          : '<p class="dim">Nothing on this flight yet.</p>'}</section>
      ${v.not_covered.length ? `<section class="card"><div class="cap">Not on this trip</div>

  },

      <button class="mi" data-go="profile">${ico('verified_user')}<span>My profile<small>Details, cards and how you get paid</small></span>${ico('arrow_forward', 'go')}</button>
      <button class="mi" data-go="chat">${ico('support_agent')}<span>Messages<small>Ask our assistant, or a person at KODA</small></span>${ico('arrow_forward', 'go')}</button>
      ${MODE.demo ? `<button class="mi" data-go="demo">${ico('tune')}<span>Demo controls<small>Trigger a delay or a cancellation</small></span>${ico('arrow_forward', 'go')}</button>` : ''}
      ${MODE.demo ? '' : `<button class="mi" id="mOut">${ico('clear')}<span>Sign out</span></button>`}
    </div>
    <p class="dim">KODA prototype for the Google Cloud AI Builder Cup. Flight data is real where available; money is simulated.</p>
  </div></div>`);
}
const closeSheet = () => { const s = $('#sheet'); if (s) s.remove(); };

/* ---------------------------------------------------------------- actions */
async function doAdd(ref, flight, missing) {
  try {
    const r = await api('/api/app/add-cover', 'POST', {ref, flight, delay: missing.includes('delay'), baggage: missing.includes('baggage'), ack: true});
    toast(`Cover added for ${sgd(r.total)}. You are covered from now.`, 'ok');
    await loadHome();
    const t = H.trips.find(x => x.ref === ref);
    stack = t ? [{name: 'trip', ref}] : [];
    tab = 'home'; form = {}; render();
  } catch (e) { fail(e); }
}
async function runEvent(code, minutes, cancelled) {
  try {
    const r = await api('/api/demo/delay', 'POST', {flight: code, minutes: +minutes, cancelled: !!cancelled});
    await loadHome();
    const paid = r.results.find(x => x.status === 'paid'), held = r.results.find(x => x.status === 'held');
    const g = H.claims.find(x => x.flight.code === code);
    if (g) { stack = [{name: 'claim', policy: g.policy}]; tab = 'claims'; render(); }
    pushNote(paid ? 'Your payout is on the way' : held ? 'A person is checking your claim' : 'Flight status updated',
      paid ? `${code} is late. We have paid your cover into your wallet.` : held ? `${code} is late. Your claim needs a human decision.` : `${code} is now ${hm(+minutes)} late. That is under the payout rule.`);
  } catch (e) { fail(e); }
}
function pushNote(title, text) {
  const el = $('#push');
  el.hidden = false;
  el.innerHTML = `${ico('bolt')}<span><b>${esc(title)}</b>${esc(text)}</span>`;
  requestAnimationFrame(() => el.classList.add('in'));
  setTimeout(() => { el.classList.remove('in'); setTimeout(() => el.hidden = true, 500); }, 5200);
}

/* ---------------------------------------------------------------- events */
$('#back').onclick = back;
$('#avatar').onclick = () => { closeSheet(); menu(); };
$('#ptsChip').onclick = () => setTab('wallet');
document.querySelectorAll('.tab').forEach(b => b.onclick = () => setTab(b.dataset.tab));

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-again],[data-hint],[data-cover],[data-ask],[data-quick],#chSend,#chPerson,[data-go],[data-trip],#aGo,[data-claim],[data-recheck],[data-bag],[data-add],[data-addmine],[data-buymine],[data-route],[data-fl],[data-tier],[data-cat],[data-port],[data-spend],[data-voucher],[data-amt],[data-mid],[data-method],[data-default],[data-pay],[data-ev],#shClose,#cGo,#bGo,#bPay,#rGo,#gAdd,#gGo,#vScan,#vRef,#coPrev,#coGo,#pSave,#mOut');
  if (!t) return;
  const d = t.dataset;

  if (t.id === 'shClose') return closeSheet();
  if (d.go === 'menu') { closeSheet(); return menu(); }
  if (d.go) {
    closeSheet();
    if (d.go === 'spend' || d.go === 'cashout' || d.go === 'profile') await loadWallet(true);
    if (d.go === 'chat') await loadChat();
    return go({name: d.go});
  }
  if (d.cover) { form = {}; await loadCover(d.cover); return go({name: 'cover', policy: d.cover}); }
  if (d.ask) {                                  // from a cover card: open the chat with that flight in the box
    await loadChat(); form = {draft: `What does my cover pay on ${d.ask}?`};
    stack.push({name: 'chat'}); render(); return;
  }
  if (d.quick) { form.draft = d.quick; return sendChat(d.quick); }
  if (t.id === 'chSend') { const v = $('#chText').value.trim(); if (v.length < 2) return; return sendChat(v); }
  if (t.id === 'chPerson') {
    try { CH = await api('/api/app/chat/person', 'POST'); form = {}; render(); } catch (err) { fail(err); }
    return;
  }
  if (d.again) { const keep = {from: form.from, to: form.to, date: form.date}; form = cur_screen() && cur_screen().name === 'buy' ? keep : {}; render(); return; }
  if (d.hint && HINT) { form.ref = HINT.ref; form.sur = HINT.surname; render(); return; }
  if (d.trip) return go({name: 'trip', ref: d.trip});
  if (d.claim) { tab = 'claims'; return go({name: 'claim', policy: d.claim}); }
  if (d.recheck) return go({name: 'recheck', policy: d.recheck});
  if (d.bag) return go({name: 'bag', policy: d.bag});
  if (d.add) {               // from the "check my ticket" result
    const [ref, flight, missing] = d.add.split('|');
    const l = (form.res.legs || []).find(x => x.flight.code === flight) || {flight: {}};
    return go({name: 'addcover', ref, flight, missing: missing.split(','), route: `${l.flight.origin} to ${l.flight.dest}`, when: l.flight.depart_label || '', risk: null, band: ''});
  }
  if (d.addmine || d.buymine) {   // from one of the traveler's own trips
    const [, flight, missing] = (d.addmine || ('|' + d.buymine + '|delay,baggage')).split('|');
    const t = H.trips.find(x => x.legs.some(l => l.flight.code === flight));
    const g = t.legs.find(l => l.flight.code === flight);
    return go({name: 'addcover', ref: t.ref, flight, missing: missing.split(','), route: `${g.flight.origin} to ${g.flight.dest}`,
               when: g.flight.depart_label, risk: g.risk ? g.risk.probability : null, band: g.risk ? g.risk.band : ''});
  }
  if (t.id === 'aGo') {
    const s2 = cur_screen();
    form.ack = $('#aAck').checked;
    if (!form.ack) return toast('Please confirm you have read the key facts.', true);
    const want = s2.missing.filter(k => form[k] !== false);
    if (!want.length) return toast('Choose at least one cover.', true);
    return doAdd(d.ref, d.flight, want);
  }

  // check a ticket
  if (t.id === 'cGo') {
    const ref = $('#cRef').value.trim().toUpperCase(), sur = $('#cSur').value.trim();
    form.ref = ref; form.sur = sur;
    if (ref.length < 5 || sur.length < 2) return toast('Enter the reference and the last name from your ticket.', true);
    try { form.res = await api('/api/app/link-booking', 'POST', {ref, surname: sur}); if (form.res.added) await loadHome(); render(); } catch (err) { fail(err); }
    return;
  }
  // partner checkout
  if (d.route) { const [a, b] = d.route.split('-'); form.from = a; form.to = b; render(); return; }
  if (t.id === 'bGo') {
    form.from = $('#bFrom').value.trim().toUpperCase(); form.to = $('#bTo').value.trim().toUpperCase(); form.date = $('#bDate').value;
    if (form.from.length !== 3) return toast('Use the three letter airport code, like SIN.', true);
    try {
      const r = await api(`/api/flights/search?origin=${form.from}&dest=${form.to}&date=${form.date}`);
      form = {...form, results: r, step: 'results'}; render();
    } catch (err) { fail(err); }
    return;
  }
  if (d.fl != null) { form = {...form, flight: form.results.flights[+d.fl], step: 'confirm', delay: true, baggage: true}; render(); return; }
  if (d.tier) { form[d.tier] = !(form[d.tier] !== false); render(); return; }
  if (t.id === 'bPay') {
    form.ack = $('#bAck').checked;
    if (!form.ack) return toast('Please confirm you have read the key facts.', true);
    try {
      const r = await api('/api/app/partner-booking', 'POST', {flight: form.flight.code, date: form.results.date, delay: form.delay !== false, baggage: form.baggage !== false, ack: true});
      await loadHome();
      stack = [{name: 'trip', ref: r.ref}]; tab = 'home'; render();
      toast(`Booked. Your reference is ${r.ref} and your cover is active.`, 'ok');
    } catch (err) { fail(err); }
    return;
  }
  // re-check
  if (t.id === 'rGo') {
    const note = $('#rNote').value.trim();
    try {
      await api('/api/app/recheck', 'POST', {policy: d.policy, note});
      await loadHome(); tab = 'claims'; stack = [{name: 'claim', policy: d.policy}]; render();
      toast('Sent. A claims officer will look at it.', 'ok');
    } catch (err) { fail(err); }
    return;
  }
  // lost bag
  if (t.id === 'gAdd') { readBag(); form.items.push({name: '', amount: ''}); render(); return; }
  if (t.id === 'gGo') {
    readBag();
    const items = form.items.filter(i => i.name.trim() && +i.amount > 0).map(i => ({name: i.name.trim(), amount: Math.round(+i.amount)}));
    if (!form.report || !form.tag || !items.length) return toast('Add the report number, the bag tag and at least one item.', true);
    try {
      await api(`/api/traveler/${d.policy}/baggage`, 'POST', {report_id: form.report, bag_tag: form.tag, items});
      await loadHome(); stack = [{name: 'claim', policy: d.policy}]; tab = 'claims'; render();
      toast('Bag claim sent.', 'ok');
    } catch (err) { fail(err); }
    return;
  }
  // wallet
  if (d.cat) { form.cat = d.cat; render(); return; }
  if (d.port) { await loadOutlets(d.port, true); render(); return; }
  if (d.spend) {
    const [id, points] = d.spend.split('|');
    try {
      const r = await api(`/api/customer/${H.customer.id}/redeem`, 'POST', {partner: id, points: +points});
      await Promise.all([loadHome(), loadWallet(true)]);
      form = {v: {...r, created_at: Date.now() / 1000, status: 'ready'}};
      stack = [{name: 'voucher', id: r.id}]; tab = 'wallet'; render();
    } catch (err) { fail(err); }
    return;
  }
  if (d.voucher) { tab = 'wallet'; return go({name: 'voucher', id: d.voucher}); }
  if (t.id === 'vScan') {
    try { const r = await api('/api/outlet/scan', 'POST', {code: d.code}); await loadWallet(true); render(); toast(`${r.partner} accepted the voucher, ${sgd(r.value)} paid with points.`, 'ok'); } catch (err) { fail(err); }
    return;
  }
  if (t.id === 'vRef') {
    try { await api(`/api/customer/${H.customer.id}/vouchers/${d.id}/refund`, 'POST'); await Promise.all([loadHome(), loadWallet(true)]); back(); toast('Points are back in your wallet.', 'ok'); } catch (err) { fail(err); }
    return;
  }
  // cash out
  if (d.amt) { form.points = +d.amt; form.preview = null; render(); return; }
  if (d.method) { form.method = d.method; form.preview = null; render(); return; }
  if (t.id === 'coPrev') {
    const p = Math.round(+$('#coPts').value || 0);
    form.points = p;
    try { form.preview = await api(`/api/app/cashout-preview?points=${p}&method=${encodeURIComponent(d.mid)}`); render(); } catch (err) { fail(err); }
    return;
  }
  if (t.id === 'coGo') {
    try {
      const r = await api('/api/app/cashout', 'POST', {points: +d.points, method: d.mid});
      await Promise.all([loadHome(), loadWallet(true)]);
      form = {}; back();
      toast(`${Number(r.receive).toLocaleString('en-US', {minimumFractionDigits: 2})} ${r.currency} is on its way to ${r.method}.`, 'ok');
    } catch (err) { fail(err); }
    return;
  }
  // profile
  if (t.id === 'pSave') {
    try { CS = await api(`/api/customer/${H.customer.id}`, 'PUT', {name: $('#pName').value.trim(), email: $('#pMail').value.trim(), phone: $('#pPhone').value.trim()}); await loadHome(); toast('Saved.', 'ok'); } catch (err) { fail(err); }
    return;
  }
  if (d.pay) {
    try { CS = await api(`/api/customer/${H.customer.id}`, 'PUT', {auto_topup: d.pay === 'cash'}); render(); } catch (err) { fail(err); }
    return;
  }
  if (d.default) {
    try { CS = await api(`/api/customer/${H.customer.id}/methods/${d.default}/default`, 'POST'); render(); } catch (err) { fail(err); }
    return;
  }
  // help
  if (t.id === 'mOut') { store.set('calmy.token', null); location.reload(); return; }
  // demo
  if (d.ev) { const [code, minutes, cancelled] = d.ev.split('|'); closeSheet(); return runEvent(code, minutes, cancelled); }
});
async function sendChat(text) {
  form.draft = '';
  const typing = {role: 'traveler', author: H.customer.name, text, ts: Date.now() / 1000};
  if (CH) { CH = {...CH, messages: [...CH.messages, typing]}; render(); }
  try { CH = await api('/api/app/chat', 'POST', {text}); } catch (e) { fail(e); await loadChat(); }
  render();
}

function readBag() {
  form.report = ($('#gRep') || {}).value || form.report;
  form.tag = ($('#gTag') || {}).value || form.tag;
  document.querySelectorAll('[data-it]').forEach(i => form.items[+i.dataset.it].name = i.value);
  document.querySelectorAll('[data-amt]').forEach(i => form.items[+i.dataset.amt].amount = i.value);
}
document.addEventListener('change', e => { if (e.target.id === 'dLeg') { form.leg = e.target.value; render(); } });
window.addEventListener('koda:unauth', () => { store.set('calmy.token', null); boot(); });
if (new URLSearchParams(location.search).get('embed')) document.documentElement.classList.add('embed');
boot();
</script>
</body>
</html>
