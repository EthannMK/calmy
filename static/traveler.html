<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#071C3F">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<title>KODA, smart flight cover</title>
<link rel="stylesheet" href="/static/fonts.css">
<link rel="stylesheet" href="/static/ui.css">
<style>
  body{background:#DDE3EB;background-image:radial-gradient(#C9D2DD 1px,transparent 1px);background-size:18px 18px}
  #app{position:relative;display:flex;flex-direction:column;width:100%;max-width:400px;height:100dvh;margin:0 auto;background:var(--paper);overflow:hidden}
  @media(min-width:440px){#app{margin:20px auto;height:860px;max-height:calc(100dvh - 40px);border-radius:34px;box-shadow:0 0 0 9px #071C3F,0 24px 70px rgba(12,27,46,.35)}}
  .top{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;background:var(--navy);color:#fff;flex-shrink:0}
  .top .mark{width:28px;height:28px;border-radius:7px;background:#0F3470}
  .top .wordmark{font-size:19px;color:#fff}
  .top .mk{margin-left:auto;font-size:12px;color:var(--navy-mute);text-align:right;line-height:1.2}
  .top .av{width:32px;height:32px;border-radius:50%;background:var(--amber);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
  #view{flex:1;overflow-y:auto;padding:16px 16px 18px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
  #view::-webkit-scrollbar{display:none}
  .foot{display:flex;justify-content:center;gap:6px;font-size:12px;color:var(--mute);padding:6px 12px;flex-shrink:0;background:var(--paper)}
  .foot button{color:var(--cobalt);font-weight:600;text-decoration:underline}
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:1px solid var(--line);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
  .tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 10px;font-size:12px;font-weight:600;color:var(--mute);position:relative}
  .tab.on{color:var(--cobalt)}
  .tab.on::before{content:'';position:absolute;top:-1px;left:30%;right:30%;height:3px;background:var(--cobalt);border-radius:0 0 3px 3px}
  .fade{display:flex;flex-direction:column;gap:14px}
  @media(prefers-reduced-motion:no-preference){.fade{animation:fade .25s ease}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}}

  h1{font-size:25px}
  .sub{font-size:13px;color:var(--mute);margin-top:6px}
  .cap{font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:8px}

  .pcard{background:linear-gradient(150deg,#0B2A5C,#071C3F 70%);color:#fff;border-radius:18px;padding:16px 18px;position:relative;overflow:hidden;display:grid;gap:6px}
  .pcard::after{content:'';position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(13,197,251,.28),transparent 70%)}
  .pc-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--navy-mute)}
  .pc-tag{font-size:12px;font-weight:600;border:1px solid var(--navy-line);border-radius:99px;padding:2px 9px;color:#C9D6E8}
  .pc-num{display:flex;align-items:baseline;gap:8px}.pc-num b{font:800 42px/1 Figtree,sans-serif;letter-spacing:-.035em;font-variant-numeric:tabular-nums}.pc-num small{color:var(--navy-mute);font-size:14px}
  .pc-eq{font-size:13px;color:#C9D6E8}.pc-eq b{color:#fff}
  .pc-uses{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .pc-uses>span{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.09);color:#E6EDF8}.pc-uses .ms{font-size:15px;color:var(--cyan,#0DC5FB)}
  .pc-foot{display:flex;justify-content:space-between;gap:10px;margin-top:8px;padding-top:10px;border-top:1px solid var(--navy-line);font-size:12.5px;color:var(--navy-mute)}.pc-foot b{color:#fff}.pc-foot b.plus{color:#7FE3B8}
  @media(prefers-reduced-motion:no-preference){.pc-uses>span{opacity:0;animation:pop .4s ease forwards}@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}}
  /* start hero */
  .hero{background:var(--board);color:#fff;border-radius:18px;padding:20px 18px 6px;position:relative;overflow:hidden}
  .hero h1{font-size:29px;line-height:1.05;letter-spacing:-.035em}.hero h1::first-line{color:#fff}
  .hero p{font-size:13px;color:var(--navy-mute);margin-top:8px;max-width:290px}
  .hero svg{margin:6px -6px 0}
  .pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid var(--navy-line);color:#C9D6E8}

  /* boarding pass */
  .bp{background:var(--navy);color:#fff;border-radius:14px;position:relative;overflow:hidden}
  .bp-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 0;font-size:13px;color:var(--navy-mute)}
  .bp-code{font-family:'Geist Mono',monospace;font-weight:700;color:var(--amber);font-size:14px}
  .bp-route{display:flex;align-items:center;padding:12px 16px 14px;gap:8px}
  .bp-ap{font-family:'Figtree',sans-serif;font-weight:800;font-size:38px;letter-spacing:-.03em;line-height:1}
  .bp-city{font-size:12px;color:var(--navy-mute);margin-top:4px;max-width:96px}
  .bp-mid{flex:1;display:flex;align-items:center;gap:6px;color:var(--amber);padding:0 2px}
  .bp-mid hr{flex:1;border:0;border-top:2px dotted var(--navy-line);margin:0}
  .bp-mid .ms{transform:rotate(90deg);font-size:22px}
  .perf{position:relative;height:0;border-top:2px dashed var(--navy-line);margin:0 18px}
  .perf::before,.perf::after{content:'';position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--paper)}
  .perf::before{left:-28px}.perf::after{right:-28px}
  .bp-foot{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 16px 14px}
  .bp-foot small{display:block;font-size:12px;color:var(--navy-mute)}
  .bp-foot b{font-size:14px;font-weight:600}
  .bp-track{padding:0 16px 8px}
  .bp-wx{display:flex;align-items:center;gap:8px;padding:0 16px 10px;font-size:12px;color:var(--navy-mute)}.bp-wx .ms{font-size:16px}.bp-wx b{color:#fff;font-weight:600}
  .bp-status{display:flex;justify-content:space-between;align-items:center;padding:0 16px 14px;font-size:12px;color:var(--navy-mute)}
  .bp-status button{color:var(--amber);font-weight:600;text-decoration:underline}
  .tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;background:#0F3470;color:#C9D6E8}
  .tag.live{background:#0F4A38;color:#7FE3B8}
  .tag.late{background:#5A1A14;color:#FFB4AB}.tag.ok{background:#0F4A38;color:#7FE3B8}

  /* generic cards */
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
  .kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:5px 0}
  .kv span:first-child{color:var(--mute)}
  .tier{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:14px;position:relative;transition:border-color .12s,background .12s}
  .tier.on{border-color:var(--cobalt);background:#F6F8FE}
  .tier .t{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-size:16px}
  .tier .d{font-size:13px;color:var(--ink2);margin-top:6px}
  .tier .px{font-family:'Geist Mono',monospace;font-size:14px;color:var(--cobalt)}
  .tick{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--faint);display:flex;align-items:center;justify-content:center;color:#fff}
  .tier.on .tick{background:var(--cobalt);border-color:var(--cobalt)}
  .tick .ms{font-size:16px}
  .opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px}
  .opt.on{border-color:var(--cobalt);background:#F6F8FE}
  .opt .c{font-family:'Geist Mono',monospace;font-weight:700;width:60px;flex-shrink:0}
  .opt .r{flex:1}
  .field.mono{font-family:'Geist Mono',monospace}
  .field::placeholder{text-transform:none}
  .field{height:46px;border-radius:10px;font-size:15px}
  .btn{height:48px;border-radius:10px;font-size:15px}
  .btn.sm{height:36px;font-size:13px}
  .daybtn{display:flex;align-items:center;gap:8px;width:100%;margin-top:10px;padding:10px 12px;border:1px solid var(--line);background:#fff;border-radius:10px;font-weight:600;font-size:14px;text-align:left}.daybtn span{flex:1;white-space:nowrap;text-align:left}.daybtn .ms{font-size:20px;color:var(--cobalt)}
  .cal{margin-top:8px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px}
  .calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.calh .cn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center}.calh .cn:disabled{opacity:.3}.calh .cn:not(:disabled):hover{background:var(--line2)}
  .calw,.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}.calw span{font-size:11px;color:var(--mute);padding:2px 0}
  .cd{height:34px;border-radius:50%;font-size:13px;font-weight:600}.cd:disabled{color:var(--faint);font-weight:400;cursor:default}.cd:not(:disabled):hover{background:var(--cobalt-t)}.cd.today{border:1px solid var(--line)}.cd.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .apq.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .apq{font-family:'Geist Mono',monospace;font-size:12px;padding:5px 10px;border:1px solid var(--line);background:#fff;border-radius:99px}
  .row2{display:flex;gap:8px}
  .step{display:flex;gap:12px;position:relative;padding-bottom:16px}
  .step:last-child{padding-bottom:0}
  .step::before{content:'';position:absolute;left:10px;top:24px;bottom:0;border-left:2px solid var(--line)}
  .step:last-child::before{display:none}
  .dot{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:2px solid var(--green);color:var(--green);background:#fff}
  .dot .ms{font-size:14px}
  .dot.wait{border-color:var(--amber);color:#B26A00;background:var(--amber-t)}
  .dot.next{border:2px dashed var(--faint);color:var(--faint)}
  .dot.fill{background:var(--green);color:#fff}
  .step b{font-size:14px}
  .step small{display:block;font-size:13px;color:var(--mute)}
  .step time{margin-left:auto;font-family:'Geist Mono',monospace;font-size:12px;color:var(--mute)}

  /* payout receipt */
  .rcpt{background:#fff;border-radius:12px 12px 0 0;position:relative;padding:20px 18px 18px;border:1px solid var(--line);border-bottom:0;margin-bottom:6px}
  .rcpt::after{content:'';position:absolute;left:-1px;right:-1px;bottom:-9px;height:9px;background:radial-gradient(circle at 7px 0,transparent 6px,#fff 6.5px) repeat-x;background-size:14px 9px;filter:drop-shadow(0 1px 0 var(--line))}
  .rcpt .amt{font-family:'Figtree',sans-serif;font-weight:800;font-size:40px;letter-spacing:-.03em;color:var(--green);line-height:1.1}
  .chk{display:grid;gap:8px;margin-top:2px;font-size:13.5px}.chk>div{display:flex;gap:8px;align-items:center}.chk .ms{font-size:18px;color:var(--cobalt)}
  .rcpt .ln{border-top:2px dashed var(--line);margin:16px 0}
  .stamp{position:absolute;right:14px;top:16px;transform:rotate(9deg);border:2px solid var(--green);color:var(--green);font-family:'Figtree',sans-serif;font-weight:800;font-size:15px;letter-spacing:.08em;padding:2px 10px;border-radius:5px;opacity:.9}
  .stamp.hold{border-color:#B26A00;color:#B26A00}
  .barcode{height:34px;margin-top:14px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 9px,var(--ink) 9px 12px,transparent 12px 14px)}

  .tabs{grid-template-columns:repeat(auto-fit,minmax(0,1fr))}.tab[hidden]{display:none!important}
  .fcbar{height:8px;border-radius:99px;background:var(--line2,#E8ECF2);overflow:hidden;margin:6px 0 8px}
  .fcbar i{display:block;height:100%;border-radius:99px;background:var(--cobalt)}
  .fc.high .fcbar i{background:#E08A00}.fc.medium .fcbar i{background:var(--cyan,#0DC5FB)}
  .pushbn{position:fixed;z-index:80;left:10px;right:10px;top:68px;display:flex;gap:10px;align-items:flex-start;background:rgba(10,20,36,.96);color:#fff;border-radius:16px;padding:11px 13px;font-size:13px;line-height:1.4;box-shadow:0 10px 30px rgba(7,28,63,.35);transform:translateY(-220%);transition:transform .45s cubic-bezier(.2,.8,.2,1);cursor:pointer;text-align:left;width:calc(100% - 20px)}
  .pushbn.in{transform:none}.pushbn b{display:block;font-size:12px;color:#FFC93C;margin-bottom:1px}.pushbn .ms{font-size:20px;color:#FFC93C;flex-shrink:0}
  .exform{display:grid;gap:8px;margin-top:10px}.exform select,.exform input[type=text]{height:40px}
  .letter{width:100%;min-height:210px;font-size:13px;line-height:1.5;resize:vertical}
  .alertbox{display:flex;gap:10px;align-items:flex-start;background:var(--amber-t);border:1px solid #F3D68E;color:#5C3A00;border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.45}
  .alertbox .ms{font-size:22px;color:#B26A00;flex-shrink:0}
  .rt{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line2,#E8ECF2);font-size:13px}
  .rt:first-of-type{border-top:0}
  .rt .st{font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 8px;flex-shrink:0;margin-top:1px}
  .rt .st.owed{background:var(--green-t);color:#0B6B49}.rt .st.maybe{background:var(--amber-t);color:#5C3A00}.rt .st.no{background:#EEF1F5;color:var(--mute)}
  .bal{background:var(--navy);color:#fff;border-radius:14px;padding:18px}
  .bal b{display:block;font-family:'Figtree',sans-serif;font-weight:800;font-size:38px;letter-spacing:-.03em;line-height:1.05;margin-top:4px}
  .bal small{color:var(--navy-mute);font-size:13px}
  .rest{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
  .rest.pick{border-color:var(--cobalt);box-shadow:0 0 0 2px var(--cobalt-t)}
  .voucher{background:#fff;border:2px dashed var(--cobalt);border-radius:12px;padding:16px;text-align:center}
  .voucher .code{font-family:'Geist Mono',monospace;font-weight:700;font-size:26px;letter-spacing:.06em;color:var(--navy);margin:6px 0}
  .seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line2);border-radius:12px;padding:3px;gap:3px}
  .seg button{height:38px;border-radius:10px;font-weight:600;font-size:14px;color:var(--mute)}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(7,28,63,.14)}
  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.chips::-webkit-scrollbar{display:none}
  .chips button{flex-shrink:0;height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600}
  .chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .leg2{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
  .cv{display:flex;gap:8px;align-items:center;font-size:13.5px}.cv .ms{font-size:18px}.cv.on .ms{color:var(--green)}.cv.off{color:var(--mute)}.cv.off .ms{color:var(--faint)}
  .avb{width:32px;height:32px;border-radius:50%;background:var(--amber);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
  .ptchip{font-size:12px;font-weight:700;background:#0F3470;color:#fff;border-radius:99px;padding:4px 10px;white-space:nowrap}
  .frm{display:flex;flex-direction:column;gap:8px}.frm label{font-size:13px;font-weight:600;display:grid;gap:4px}
  .row3{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line2)}.mrow:first-of-type{border-top:0}
  .tx{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line2);font-size:13.5px}.tx:first-of-type{border-top:0}.tx b{margin-left:auto}
  .tx .plus{color:var(--green)}
  .frm label.swrow,.swrow{display:flex;gap:10px;align-items:flex-start;font-size:14px}.swrow input{margin-top:3px;width:18px;height:18px;accent-color:var(--cobalt)}
  /* test tools sheet */
  .bk{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .bk .ms{transform:scaleX(-1);font-size:20px}.bk[hidden]{display:none}
  .sbox{display:grid;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 1px 3px rgba(7,28,63,.06)}
  .sbox label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--mute)}.sbox select{appearance:none;font-weight:600;font-size:15px;color:var(--ink)}
  .fc2{display:grid;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(7,28,63,.05)}
  .fc2:hover{border-color:var(--cobalt)}
  .fc2 .t1{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute)}
  .fc2 .mid{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
  .fc2 .mid b{font-size:20px;font-weight:700;display:block;letter-spacing:-.01em}.fc2 .mid small{font-size:12px;color:var(--mute)}
  .fc2 .ln{display:grid;justify-items:center;gap:2px;font-size:11.5px;color:var(--mute)}.fc2 .ln hr{width:100%;border:0;border-top:2px solid var(--line);margin:0}
  .fc2 .bt{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12.5px;border-top:1px dashed var(--line);padding-top:10px}
  .rk{font-weight:600;border-radius:99px;padding:3px 9px;font-size:12px}.rk.low{background:#E5F6EC;color:#12663A}.rk.medium{background:#FFF1D6;color:#7A4B00}.rk.high{background:#FDE4E1;color:#9A2A1D}
  .gcode{font-size:22px;letter-spacing:.3em;text-align:center}
  #sheet{position:absolute;inset:0;background:rgba(12,27,46,.45);z-index:50;display:flex;align-items:flex-end}
  #sheet .in{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:18px;display:flex;flex-direction:column;gap:12px;max-height:90%;overflow-y:auto}
  #toast{position:absolute;left:14px;right:14px;bottom:86px;transform:none;max-width:none;z-index:60}
  .embed body{background:transparent;background-image:none}
  .embed #app{margin:0;max-width:none;height:100dvh;max-height:none;border-radius:0;box-shadow:none}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button id="back" class="bk" hidden aria-label="Back"><span class="ms" aria-hidden="true">arrow_forward</span></button>
    <span class="wordmark" role="img" aria-label="KODA"><i>K</i><i>O</i><i>D</i><i>A</i></span>
    <span id="mkt" class="mk"></span>
    <button id="ptsChip" class="ptchip" hidden aria-label="Open your wallet"></button>
    <button id="avatar" class="av" aria-label="Sign in or open your profile">?</button>
  </header>

  <div id="view"></div>

  <nav class="tabs" aria-label="Sections">
    <button data-tab="cover" class="tab"><span class="ms" aria-hidden="true">shield</span><span>Cover</span></button>
    <button data-tab="claims" class="tab"><span class="ms" aria-hidden="true">receipt_long</span><span>Claims</span></button>
    <button data-tab="wallet" class="tab" id="walletTab" hidden><span class="ms" aria-hidden="true">payments</span><span>Wallet</span></button>
    <button data-tab="help" class="tab"><span class="ms" aria-hidden="true">support_agent</span><span>Help</span></button>
  </nav>

</div>

<script src="/static/ui.js"></script>
<script>
const EMBED = new URLSearchParams(location.search).has('embed'); if (EMBED) document.documentElement.classList.add('embed');
let PID = new URLSearchParams(location.search).get('p') || store.get('calmy.pid');
let S = null, MK = {}, tab = ['cover', 'claims', 'wallet', 'help'].includes(new URLSearchParams(location.search).get('tab')) ? new URLSearchParams(location.search).get('tab') : 'cover', sel = {delay: true, baggage: true}, ack = false, showWhy = false, bagOpen = false, factsOpen = false, bagForm = false;
let W = null, voucher = null, otherOpen = false;

function compress(file) {
  return new Promise((ok, no) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, 900 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);

    img.onerror = () => no(new Error('That photo could not be read.')); img.src = u;
  });
}

    ['What is not covered?', 'A delay under 3 hours, a bag that is only late, a flight you did not take, and anything that happened before you added cover. A trip with only baggage cover gets no delay payout, and the other way round.'],
    ['Why was my claim held?', 'Some claims are checked by a person to prevent fraud. Most reviews are quick.']];
  return `<h1>Help</h1>${qa.map(([q, a]) => `<div class="card"><b>${q}</b><p class="mute" style="margin-top:6px;font-size:13px">${a}</p></div>`).join('')}
    <div class="mute" style="font-size:12px">The full cover rules are in the coverage guide in the project documents.</div>`;
}

/* ---------------- events ---------------- */
function pickFlight(code, market) {
  const hit = [...REAL, ...SAMPLES].find(f => f.code === code); form.flight = code; form.market = market; selFlight = hit || {code, origin: '', dest: '', depart_label: '', airline: ''}; calOpen = false; bstep = 'details'; render(true);
}
function bind() {
  document.querySelectorAll('[data-sel]').forEach(el => el.onclick = () => { sel[el.dataset.sel] = !sel[el.dataset.sel]; render(true); });
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  const ak = $('#ack'); if (ak) ak.onchange = () => { ack = ak.checked; render(true); };
  on('#factsToggle', () => { factsOpen = !factsOpen; render(true); });
  on('#addCover', async () => {
    $('#addCover').disabled = true;
    try { await api(`/api/traveler/${PID}/checkout`, 'POST', {...sel, ack}); ack = false; } catch (e) { fail(e); }
    await load();
  });
  on('#otherToggle', () => { otherOpen = !otherOpen; render(true); });
  document.querySelectorAll('[data-redeem]').forEach(b => b.onclick = async () => {
    b.disabled = true;

    catch (e) { fail(e); }

  });
  on('#why', () => { showWhy = !showWhy; render(true); });
  on('#done', () => setTab('cover'));

  const xp = $('#exPhoto'); if (xp) xp.onchange = async () => { const f = xp.files[0]; if (!f) return; try { ex.receipt = await compress(f); ex.name = f.name.slice(0, 24); $('#exPhotoTxt').textContent = 'Receipt attached: ' + ex.name; } catch (e) { fail(e); } };
  on('#exSend', async () => {
    const amount = parseInt(ex.amount, 10); if (!(amount > 0)) return fail('Enter the amount on the receipt.');
    try { await api(`/api/traveler/${PID}/extra-claim`, 'POST', {what: ex.what, amount, receipt: ex.receipt}); ex = {open: false, what: 'Meal', amount: '', receipt: null, name: ''}; }
    catch (e) { return fail(e); }
    await load();
  });
  on('#letterStart', async () => {
    letterOpen = true; letter = null; edited = false; render(true);
    try { letter = await api(`/api/traveler/${PID}/airline-letter`); } catch (e) { letter = {text: 'The letter could not be written. Try again in a moment.'}; }
    render(true);
    api(`/api/traveler/${PID}/airline-letter?ai=1`).then(r => { if (r.ai && !edited && letterOpen) { letter = r; render(true); } }).catch(() => {});
  });
  on('#letterClose', () => { letterOpen = false; render(true); });
  const lt = $('#letterTxt'); if (lt) lt.oninput = () => { edited = true; if (letter) letter.text = lt.value; };
  on('#letterCopy', async () => { try { await navigator.clipboard.writeText($('#letterTxt').value); toast('Letter copied.', 'ok'); } catch (e) { $('#letterTxt').select(); toast('Select the text and copy it.', 'ok'); } });
  on('#bagToggle', () => { bagOpen = !bagOpen; render(true); });
  on('#bagStart', () => { bagForm = true; render(true); });
  on('#bagCancel', () => { bagForm = false; render(true); });
  on('#addItem', () => { bag.items.push({name: '', amount: ''}); render(true); });
  document.querySelectorAll('.rmItem').forEach(b => b.onclick = () => { bag.items.splice(+b.dataset.rm, 1); render(true); });
  document.querySelectorAll('[data-bi]').forEach(i => i.oninput = () => { bag.items[+i.dataset.bi][i.dataset.k] = i.value; });
  const br = $('#bReport'); if (br) br.oninput = () => bag.report_id = br.value;
  const bt = $('#bTag'); if (bt) bt.oninput = () => bag.bag_tag = bt.value;
  on('#bagSend', async () => {
    const items = bag.items.filter(i => i.name.trim() || i.amount).map(i => ({name: i.name.trim(), amount: parseInt(i.amount, 10)}));
    if (!bag.report_id.trim() || !bag.bag_tag.trim()) return fail('Enter the airline report number and the bag tag.');
    if (!items.length || items.some(i => !i.name || !(i.amount > 0))) return fail('Each item needs a name and a value above zero.');
    try { await api(`/api/traveler/${PID}/baggage`, 'POST', {report_id: bag.report_id.trim(), bag_tag: bag.bag_tag.trim(), items}); bagForm = false; tab = 'claims'; bag = {report_id: '', bag_tag: '', items: [{name: '', amount: ''}]}; }
    catch (e) { return fail(e); }
    await load();
  });
  on('#reReview', async () => { try { await api(`/api/traveler/${PID}/review-request`, 'POST'); toast('Sent. A person will look at it again.', 'ok'); } catch (e) { fail(e); } await load(); });
  on('#checkNow', async () => {
    try { const r = await api(`/api/flights/${encodeURIComponent(S.flight.code)}/refresh`, 'POST'); toast(`Checked. Delay now ${r.flight.delay_minutes} min.`, 'ok'); } catch (e) { fail(e); }
    await load();
  });
  document.querySelectorAll('[data-newtrip]').forEach(b => b.onclick = newTrip);
  // start view
  const fl = $('#fFlight'); if (fl) fl.oninput = () => { form.flight = fl.value; };
  const fn = $('#fName'); if (fn) fn.oninput = () => form.name = fn.value;
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { mode = b.dataset.mode; chk.err = ''; if (b.id === 'otherLeg') { chk.ref = S.policy.pnr || ''; chk.name = S.policy.traveler.split(' ').pop(); PID = null; S = null; store.set('calmy.pid', null); chk.res = null; $('#view').dataset.k = ''; render(true); runCheck(); return; } render(true); });
  const cr = $('#cRef'); if (cr) cr.oninput = () => { chk.ref = cr.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase(); cr.value = chk.ref; };
  const cn = $('#cName'); if (cn) cn.oninput = () => chk.name = cn.value;
  const runCheck = async () => {
    chk.err = '';
    if (chk.ref.length < 5) { chk.err = 'Enter the booking reference from your ticket.'; return render(true); }
    if (chk.name.trim().length < 2) { chk.err = 'Enter the last name on the ticket.'; return render(true); }
    $('#cGo').disabled = true;
    try { chk.res = await api(`/api/booking/${encodeURIComponent(chk.ref)}?surname=${encodeURIComponent(chk.name.trim())}`); demoOpen = false; }
    catch (e) { chk.res = null; chk.err = String(e); }
    render(true);
  };
  on('#cGo', runCheck);
  [cr, cn].forEach(i => { if (i) i.onkeydown = e => { if (e.key === 'Enter') runCheck(); }; });
  on('#demoToggle', () => { demoOpen = !demoOpen; render(true); });
  document.querySelectorAll('[data-demo]').forEach(b => b.onclick = () => { const [r, s] = b.dataset.demo.split(':'); chk.ref = r; chk.name = s; runCheck(); });
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = async () => { PID = b.dataset.open; store.set('calmy.pid', PID); tab = 'cover'; screen = null; await load(); render(true); });
  document.querySelectorAll('[data-addleg]').forEach(b => b.onclick = async () => {
    b.disabled = true; const r = chk.res;
    try { const q = await api('/api/policies', 'POST', {name: r.passenger, flight: b.dataset.addleg, booking_ref: r.ref, customer: CID || null}); PID = q.policy; store.set('calmy.pid', PID); if (q.session) store.set('calmy.token', q.session); tab = 'cover'; sel = {delay: true, baggage: true}; ack = false; chk.res = null; mode = 'buy'; }
    catch (e) { fail(e); b.disabled = false; return; }
    await load(); render(true);
  });
  document.querySelectorAll('[data-addmore]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { const r = await api(`/api/traveler/${PID}/add-cover`, 'POST', {delay: b.dataset.addmore === 'delay', baggage: b.dataset.addmore === 'baggage'}); toast(`Added. You paid ${money(r.added, r.currency)} more.`, 'ok'); } catch (e) { fail(e); }
    await load(); render(true);
  });
  // wallet and profile
  document.querySelectorAll('[data-refund]').forEach(b => b.onclick = async () => { b.disabled = true; try { const r = await api(`/api/customer/${CID}/vouchers/${b.dataset.refund}/refund`, 'POST'); toast(`${pts(r.points)} are back in your wallet.`, 'ok'); voucher = null; } catch (e) { fail(e); } await load(); render(true); });
  document.querySelectorAll('[data-air]').forEach(b => b.onclick = async () => { svAir = b.dataset.air; svCat = 'all'; SV = null; render(true); await loadServices(); render(true); });
  document.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { svCat = b.dataset.cat; render(true); });
  document.querySelectorAll('[data-profile]').forEach(b => b.onclick = () => { screen = 'profile'; render(true); const t = $(b.dataset.profile === 'cash' ? '#pCash' : '#pPay'); if (t) t.scrollIntoView(); });
  document.querySelectorAll('[name=pay]').forEach(r => r.onchange = async () => { try { CS = await api('/api/customer/' + CID, 'PUT', {auto_topup: r.value === 'card'}); toast(r.value === 'card' ? 'Done. New payouts go straight to your saved account.' : 'Done. New payouts arrive as points.', 'ok'); } catch (e) { fail(e); } await load(); render(true); });
  on('#nOpen', () => { nm.open = true; render(true); });
  on('#nCancel', () => { nm = {open: false, kind: 'card', number: '', holder: '', expiry: '', bank: ''}; render(true); });
  document.querySelectorAll('[data-nk]').forEach(b => b.onclick = () => { nm.kind = b.dataset.nk; nm.number = ''; render(true); });
  const nn = $('#nNum'); if (nn) nn.oninput = () => { nm.number = nn.value.replace(/[^\d ]/g, ''); nn.value = nm.number; };
  const nh = $('#nHold'); if (nh) nh.oninput = () => nm.holder = nh.value;
  const ne = $('#nExp'); if (ne) ne.oninput = () => { let v = ne.value.replace(/\D/g, '').slice(0, 4); if (v.length > 2) v = v.slice(0, 2) + '/' + v.slice(2); nm.expiry = ne.value = v; };
  const nb = $('#nBank'); if (nb) nb.onchange = () => nm.bank = nb.value;
  on('#nSave', async () => {
    try { const r = await api(`/api/customer/${CID}/methods`, 'POST', {kind: nm.kind, number: nm.number, holder: nm.holder || CS.customer.name, bank: nm.kind === 'bank' ? nm.bank : null, expiry: nm.kind === 'card' ? nm.expiry : null}); CS = r.summary; toast(`Saved ${r.method.label}.${CS.customer.auto_topup ? ' New payouts now go straight to it.' : ''}`, 'ok'); nm = {open: false, kind: 'card', number: '', holder: '', expiry: '', bank: ''}; co.method = ''; }
    catch (e) { return fail(e); }
    await load(); render(true);
  });
  document.querySelectorAll('[data-mdef]').forEach(b => b.onclick = async () => { try { CS = await api(`/api/customer/${CID}/methods/${b.dataset.mdef}/default`, 'POST'); toast('Default updated.', 'ok'); } catch (e) { fail(e); } await load(); render(true); });
  document.querySelectorAll('[data-mdel]').forEach(b => b.onclick = async () => { try { CS = await api(`/api/customer/${CID}/methods/${b.dataset.mdel}`, 'DELETE'); toast('Removed.', 'ok'); co.method = ''; } catch (e) { fail(e); } await load(); render(true); });
  const cp = $('#coPts'); if (cp) cp.oninput = () => { co.points = cp.value.replace(/\D/g, ''); cp.value = co.points; }; if (cp) cp.onchange = () => render(true);
  const cm = $('#coMethod'); if (cm) cm.onchange = () => co.method = cm.value;
  on('#coGo', async () => {
    try { const r = await api(`/api/customer/${CID}/cashout`, 'POST', {points: parseInt(co.points, 10) || 0, method: co.method}); CS = r.summary; toast(`Done. ${usd2(r.usd)} sent to ${r.to}.`, 'ok'); co.points = ''; }
    catch (e) { return fail(e); }
    await load(); render(true);
  });
  const pn = $('#pName'); if (pn) pn.oninput = () => pf.name = pn.value;
  const pe = $('#pEmail'); if (pe) pe.oninput = () => pf.email = pe.value;
  const pp = $('#pPhone'); if (pp) pp.oninput = () => pf.phone = pp.value;
  on('#pSave', async () => {
    try { CS = await api('/api/customer/' + CID, 'PUT', {name: pf.name, email: pf.email, phone: pf.phone, notify: $('#pNotify').checked}); pf = {name: CS.customer.name, email: CS.customer.email || '', phone: CS.customer.phone || '', init: true}; toast('Details saved.', 'ok'); }
    catch (e) { return fail(e); }
    await load(); render(true);
  });
  on('#signOut', () => signOut());
  on('#goSignin', () => openSignin());
  on('#sSearch', runSearch);
  const sf = $('#sFrom'); if (sf) sf.onchange = () => { ap = sf.value; if (toAp === ap) toAp = ''; render(true); };
  const st = $('#sTo'); if (st) st.onchange = () => { toAp = st.value; };
  document.querySelectorAll('[data-route]').forEach(b => b.onclick = () => { [ap, toAp] = b.dataset.route.split('-'); runSearch(); });
  document.querySelectorAll('[data-sort]').forEach(b => b.onclick = () => { sortBy = b.dataset.sort; render(true); });
  document.querySelectorAll('[data-pick2]').forEach(b => b.onclick = () => { const f = (SR ? SR.flights : []).find(x => x.code === b.dataset.pick2); if (f) { pickFlight(f.code, f.market); window.scrollTo(0, 0); $('#view').scrollTop = 0; } });
  on('#back', goBack);
  const sr = $('#sRef'); if (sr) sr.oninput = () => { si.ref = sr.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase(); sr.value = si.ref; };
  const sn = $('#sName'); if (sn) sn.oninput = () => si.name = sn.value;
  document.querySelectorAll('[data-sdemo]').forEach(b => b.onclick = () => { [si.ref, si.name] = b.dataset.sdemo.split(':'); si.err = ''; render(true); });
  const sendCode = async () => {
    si.err = ''; if (si.ref.length < 5 || si.name.trim().length < 2) { si.err = 'Enter the booking reference and the last name on the ticket.'; return render(true); }
    try { si.ch = await api('/api/auth/traveler/start', 'POST', {ref: si.ref, surname: si.name.trim()}); si.code = si.ch.demo_code || ''; si.stage = 'code'; } catch (e) { si.err = String(e); }
    render(true);
  };
  on('#sSend', sendCode); on('#sResend', sendCode);
  [sr, sn].forEach(i => { if (i) i.onkeydown = e => { if (e.key === 'Enter') sendCode(); }; });
  const sc = $('#sCode'); if (sc) { sc.oninput = () => { si.code = sc.value.replace(/\D/g, ''); sc.value = si.code; }; sc.onkeydown = e => { if (e.key === 'Enter') $('#sGo').click(); }; }
  on('#sGo', async () => {
    try { const r = await api('/api/auth/verify', 'POST', {challenge: si.ch.challenge, code: si.code}); store.set('calmy.token', r.token); pf.init = false; screen = null; si.stage = 'ref'; si.ch = null; si.err = ''; toast('Signed in.', 'ok'); }
    catch (e) { si.err = String(e); return render(true); }
    await load(); render(true);
  });
  document.querySelectorAll('.pick').forEach(b => b.onclick = () => pickFlight(b.dataset.pick, b.dataset.mk));
    on('#dayBtn', () => { calOpen = !calOpen; render(true); });
  on('#calPrev', () => { const c = calMonth || fromISO(selDate || WINDOW()[0]); calMonth = new Date(c.getFullYear(), c.getMonth() - 1, 1); render(true); });
  on('#calNext', () => { const c = calMonth || fromISO(selDate || WINDOW()[0]); calMonth = new Date(c.getFullYear(), c.getMonth() + 1, 1); render(true); });
  document.querySelectorAll('.cd').forEach(b => b.onclick = () => { selDate = b.dataset.day; calMonth = null; calOpen = false; if (bstep === 'results') runSearch(); else render(true); });
  const fref = $('#fRef'); if (fref) fref.oninput = () => { form.ref = fref.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase(); fref.value = form.ref; };
  on('#fUse', async () => {
    const v = form.flight.replace(/\s/g, '').toUpperCase(); if (!v) return fail('Enter a flight number, for example TG 102.');
    const hit = [...SAMPLES, ...REAL].find(f => f.code.replace(/\s/g, '') === v);
    if (hit) return pickFlight(hit.code, hit.market);
    $('#fUse').disabled = true; realMsg = 'Looking up ' + v + '...';
    try { const f = await api('/api/live/lookup?flight=' + encodeURIComponent(v) + (selDate && selDate !== WINDOW()[0] ? '&date=' + selDate : '')); realMsg = ''; REAL = [f, ...REAL.filter(x => x.code !== f.code)]; pickFlight(f.code, f.market); }
    catch (e) { realMsg = String(e); render(true); }
  });
  on('#quote', async () => {
    if (!form.flight.trim()) return fail('Pick a flight first.');
    if (form.name.trim().length < 2) return fail('Enter your name as it appears on your ticket.');
    if (!/^[A-Za-z0-9]{5,10}$/.test(form.ref)) return fail('Enter the booking reference from your ticket. It is 5 to 10 letters or numbers.');
    $('#quote').disabled = true; $('#quote').textContent = 'Checking your flight...';
    try {
      const r = await api('/api/policies', 'POST', {name: form.name.trim(), flight: form.flight.trim(), date: (selFlight && selFlight.flight_date) || selDate || null, booking_ref: form.ref, customer: CID || null});
      PID = r.policy; if (r.session) { store.set('calmy.token', r.session); pf.init = false; } if (!r.verified) toast('Booking reference saved. We could not check it with the airline in this demo, so it is marked not verified.', 'ok'); store.set('calmy.pid', PID); tab = 'cover'; sel = {delay: true, baggage: true}; ack = false;
    } catch (e) { fail(e); $('#quote') && ($('#quote').disabled = false); return; }
    await load();
  });
}
async function loadReal() {
  if (!selDate) selDate = WINDOW()[0];
  try { LIVE = await api('/api/live/status'); } catch (e) {}
  render(true);
}

function newTrip() { PID = null; S = null; store.set('calmy.pid', null); history.replaceState(null, '', location.pathname); form = {name: '', flight: '', market: '', ref: ''}; selFlight = null; selDate = ''; calOpen = false; tab = 'cover'; screen = null; mode = 'buy'; chk.res = null; load().then(() => loadReal()); }

// The live demo page drives this app from outside: it can switch trip, switch tab or clear the app.
window.addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data) return;
  if (e.data.reset) { PID = null; S = null; store.set('calmy.pid', null); form = {name: '', flight: '', market: '', ref: ''}; selFlight = null; selDate = ''; calOpen = false; tab = 'cover'; screen = null; mode = 'buy'; chk = {ref: '', name: '', res: null, err: ''}; CID = null; CS = null; ME = null; store.set('calmy.token', null); bstep = 'search'; toAp = ''; SR = null; si = {stage: 'ref', ref: '', name: '', ch: null, code: '', err: '', demos: si.demos}; pf.init = false; load().then(() => { if (LIVE.ready) loadReal(); }); return; }
  if (e.data.pid) { PID = e.data.pid; store.set('calmy.pid', PID); }
  if (e.data.token) { store.set('calmy.token', e.data.token); pf.init = false; }
  if (e.data.check) { PID = null; S = null; store.set('calmy.pid', null); mode = 'check'; chk = {ref: e.data.check.ref, name: e.data.check.surname, res: null, err: ''}; }
  if (e.data.tab) { tab = e.data.tab; screen = null; }
  if (e.data.check && e.data.check.auto) setTimeout(() => { const g = $('#cGo'); if (g) g.click(); }, 700);
  load().then(() => { render(true); if (tab === 'wallet') loadWallet(); });
});

$('#avatar').onclick = () => { if (CID) { screen = screen === 'profile' ? null : 'profile'; render(true); } else openSignin(); };
$('#ptsChip').onclick = () => setTab('wallet');
// Poll so a payout triggered elsewhere shows up here. Skipped while typing so forms are not wiped.
setInterval(() => { if (!document.hidden && (PID || CID)) load().catch(() => {}); }, EMBED ? 2500 : 4000);
(async () => {
  try { SAMPLES = await api('/api/live/samples'); } catch (e) {}
  try { LIVE = await api('/api/live/status'); } catch (e) {}
  try { DEMO = await api('/api/demo/bookings'); } catch (e) {}
  await load().catch(e => fail(e));
  render(true);
  if (LIVE.ready && !PID) loadReal();
})();
</script>
</body>
