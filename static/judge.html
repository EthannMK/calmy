<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071C3F">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<title>KODA live demo</title>
<link rel="stylesheet" href="/static/fonts.css">
<link rel="stylesheet" href="/static/ui.css">
<style>
  html,body{height:100%}
  body{display:flex;flex-direction:column;background:var(--paper);overflow:hidden}
  .bar{display:flex;align-items:center;gap:14px;padding:8px 20px;background:var(--navy);color:#fff;flex-shrink:0}
  .bar .wordmark{font-size:19px}
  .bar .t{font-size:13px;color:var(--navy-mute);padding-left:14px;border-left:1px solid var(--navy-line)}
  .bar .push{margin-left:auto;display:flex;gap:8px;align-items:center}
  .bar a,.bar button{color:#C9D6E8;font-size:13px;font-weight:600;padding:5px 12px;border:1px solid var(--navy-line);border-radius:6px}
  .bar a:hover,.bar button:hover{background:#0B2C60;text-decoration:none}
  /* Stage: the phone keeps a true phone shape that fits the window, the insurer desk takes the rest. */
  .stage{flex:1;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;padding:16px 24px 20px;align-items:stretch;justify-content:center}
  .side{display:flex;flex-direction:column;min-height:0;min-width:0}
  .cap{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px;color:var(--mute);height:28px}
  .cap b{font-family:'Figtree',sans-serif;font-size:17px;color:var(--ink);letter-spacing:-.01em}
  .cap em{font-style:normal;font-weight:700;color:var(--cobalt);background:var(--cobalt-t);border-radius:99px;padding:2px 10px;font-size:12.5px}
  .phone{flex:1;min-height:0;aspect-ratio:390/812;background:var(--navy);padding:9px;border-radius:40px;box-shadow:0 18px 40px rgba(7,28,63,.22)}
  .phone iframe{width:100%;height:100%;border:0;border-radius:32px;background:#fff;display:block}
  .desk{flex:1;min-height:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 10px 30px rgba(7,28,63,.1);display:flex}
  .desk iframe{flex:1;border:0;width:100%;min-height:0}
  .tabs{display:none}
  #toast{position:fixed}
  @media(max-width:1000px){
    body{overflow:auto}
    .stage{grid-template-columns:1fr;grid-template-rows:auto auto;padding:12px}
    .tabs{display:flex;gap:6px;padding:10px 12px 0}.tabs button{flex:1;height:36px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:600}
    .tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
    .side{display:none}.side.show{display:flex}
    .phone{flex:none;width:min(400px,100%);height:800px;aspect-ratio:auto;margin:0 auto}.desk{flex:none;height:800px}
  }
</style>
</head>
<body>
<header class="bar"><span class="wordmark" role="img" aria-label="KODA"><i>K</i><i>O</i><i>D</i><i>A</i></span><span class="t">Live demo: one traveler, one insurer</span>
  <div class="push"><button id="reset">Reset demo</button><a href="/">Exit</a></div></header>
<div class="tabs" id="tabs"><button data-t="phone" class="on">Traveler</button><button data-t="desk">Insurer</button></div>
<main class="stage">
  <section class="side show" id="s-phone"><div class="cap"><b>Traveler</b><em>George, on the phone</em></div><div class="phone"><iframe id="phone" data-src="/traveler?embed=1" title="Traveler app"></iframe></div></section>
  <section class="side show" id="s-desk"><div class="cap"><b>Insurer</b><em>Ethan, claims officer at Flightwise Insurance</em></div><div class="desk"><iframe id="desk" data-src="/console?embed=1" title="Insurer console"></iframe></div></section>
</main>
<div id="toast" class="hidden"></div>
<script src="/static/ui.js"></script>
<script>
const phone = $('#phone'), desk = $('#desk');
// Both apps open already signed in with the demo accounts. Sign-in codes are used outside the demo.
async function boot() {
  try { const r = await api('/api/auth/demo-session', 'POST', {kind: 'staff', id: 'ST-1'}); store.set('koda.token', r.token); store.set('koda.staff', r.me.id); } catch (e) {}
  try { const r = await api('/api/auth/demo-session', 'POST', {kind: 'traveler', id: 'CU-GEORGE'}); store.set('calmy.token', r.token); } catch (e) {}
  phone.src = phone.dataset.src; desk.src = desk.dataset.src;
}
$('#reset').onclick = async () => {
  try { await api('/api/demo/reset', 'POST'); await boot(); toast('Demo data reset.', 'ok'); } catch (e) { fail(e); }
};
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  $('#s-phone').classList.toggle('show', b.dataset.t === 'phone'); $('#s-desk').classList.toggle('show', b.dataset.t === 'desk');
});
boot();
</script>
</body>
</html>
